.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--chip);outline:none}
.dd-menu button[aria-checked="true"]{color:var(--accent);font-weight:600}

.f-clear{min-height:36px;padding:0 10px;border:0;background:none;color:var(--muted);font:400 13px var(--f-cjk);cursor:pointer;text-decoration:underline}

.scard .attrs dt{color:var(--muted);font-family:var(--f-cjk)}
.scard .attrs dd{margin:0;text-align:left;color:var(--fg);font-family:var(--f-body)}
.scard[hidden]{display:none!important}

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: sample-room bench — a KeyShot-grey stage on the left (render photos or live 3D), spec card on the right; stacks on phones */
:root{
  --bg:#e9ebee; --panel:#ffffff; --fg:#1b2028; --muted:#5d6672;
  --line:#d3d8de; --accent:#d9631e; --chip:#eef0f3; --warn-bg:#fdf0e6; --warn-fg:#8a3a0c;
  --stage:#383838; --stage-fg:#eceae6; --stage-muted:#a9a6a1; --stage-line:#4c4c4c; --stage-btn:#2c2c2c;
  --f-body:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --f-cjk:"Noto Sans TC","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1f242c; --fg:#e7eaee; --muted:#9aa3ae;
  --line:#323943; --accent:#ef7a35; --chip:#272d36; --warn-bg:#3a2516; --warn-fg:#f3b38a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1f242c; --fg:#e7eaee; --muted:#9aa3ae;
  --line:#323943; --accent:#ef7a35; --chip:#272d36; --warn-bg:#3a2516; --warn-fg:#f3b38a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.wrap{align-items:start}
.stage{position:sticky;top:16px;height:calc(100vh - 32px);background:var(--stage);color:var(--stage-fg);border-radius:6px;min-height:520px;overflow:hidden;display:flex;flex-direction:column}
.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 0;position:relative;z-index:3}
.style-id{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--stage-muted);text-transform:uppercase}
.style-id b{display:block;font-family:var(--f-body);font-size:26px;letter-spacing:.02em;color:var(--stage-fg);font-weight:600;text-transform:none}
.mode{display:flex;gap:2px;padding:3px;background:var(--stage-btn);border-radius:6px}
.mode button{color:var(--stage-muted)}
.mode button[aria-pressed="true"]{background:var(--stage-fg);color:var(--stage)}
.view{position:relative;flex:1;min-height:420px}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none!important}
/* render photo */
.photo{position:absolute;inset:0;overflow:hidden;cursor:zoom-in;touch-action:pan-y}
.photo.zoomed{cursor:zoom-out;touch-action:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;transform-origin:50% 50%;transition:transform .25s ease;user-select:none;-webkit-user-drag:none}
.photo.zoomed img{transition:none}
.badge{position:absolute;right:16px;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--stage-muted);letter-spacing:.06em;pointer-events:none}
model-viewer{width:100%;height:100%;background:var(--stage);--poster-color:transparent;--progress-bar-color:transparent}
.hint{position:absolute;right:16px;top:8px;font-size:12px;color:var(--stage-muted);text-align:right;font-family:var(--f-cjk);pointer-events:none}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--stage);z-index:2}
.loader[hidden]{display:none!important}
.loader-box{width:min(280px,80%);display:grid;gap:8px;font-family:var(--f-cjk)}
.bar{height:4px;background:var(--stage-line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.loader small{font-family:var(--f-mono);color:var(--stage-muted);font-size:12px}
.err{color:#ff9a5c}
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.login[hidden]{display:none!important}
.login-card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 24px;display:grid;gap:16px;box-sizing:border-box}
.login-card .style-id{color:var(--muted)}
.login-card .style-id b{color:var(--fg)}
.login-card label{display:grid;gap:6px;font-family:var(--f-cjk);font-size:13px;color:var(--muted)}
.login-card input{font:inherit;font-family:var(--f-mono);font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.login-card .go{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:11px;font-size:15px;font-weight:600}
.login-card .go:hover{background:var(--accent);filter:brightness(1.08)}
.login-card .go:disabled{opacity:.6;cursor:wait}
.login-msg{min-height:1.2em;font-size:13px;font-family:var(--f-cjk);color:var(--accent);margin:0}
.login-card .style-id b{font-size:32px;letter-spacing:.06em}
.brand-id{text-transform:none;letter-spacing:.12em}.brand-id b{font-size:24px!important;letter-spacing:.01em!important;line-height:1.2;margin-top:4px}
.login-sub{display:block;margin-top:2px;font-family:var(--f-cjk);font-size:15px;letter-spacing:.12em;color:var(--fg);text-transform:none}
.login-foot{font-size:12px;color:var(--muted);font-family:var(--f-cjk);margin:0}
.wrap[hidden],.picker[hidden]{display:none!important}
.picker{min-height:100%;box-sizing:border-box;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start;max-width:1200px;margin:0 auto}
.picker-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.picker-head .style-id{color:var(--muted)}
.picker-head .style-id b{color:var(--fg)}
.picker-head .logout{color:var(--muted);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.scard{display:grid;grid-template-rows:auto 1fr;padding:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:var(--fg);cursor:pointer}
.scard:hover{background:var(--panel);border-color:var(--accent)}
.scard .img{aspect-ratio:5/4;background:var(--stage);display:block;width:100%;height:auto;object-fit:cover;max-width:100%}
.scard .meta{padding:14px 16px;display:grid;gap:4px}
.scard .nm{font-family:var(--f-body);font-size:20px;font-weight:600;letter-spacing:.02em}
.scard .ds{font-family:var(--f-cjk);font-size:13px;color:var(--muted)}
.scard .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.scard .tags span{font-family:var(--f-cjk);font-size:11.5px;background:var(--chip);border-radius:3px;padding:2px 6px;color:var(--muted)}
.picker-foot{font-size:12px;color:var(--muted);font-family:var(--f-cjk);margin:0}
.back{color:var(--stage-muted);font-size:12px;padding:6px 8px;border:1px solid var(--stage-line)!important}
.stage-actions{display:flex;gap:8px;align-items:center}
.logout{color:var(--stage-muted);font-size:12px;padding:6px 8px}
/* view strip */
.strip{display:flex;gap:6px;padding:10px 16px 14px;overflow-x:auto;position:relative;z-index:3}
.strip button{flex:0 0 auto;display:grid;gap:4px;justify-items:center;padding:4px;border:1px solid transparent;color:var(--stage-muted);font-size:12px}
.strip img{width:84px;height:67px;object-fit:cover;border-radius:3px;display:block;max-width:none}
.strip button[aria-pressed="true"]{border-color:var(--accent);color:var(--stage-fg)}
.strip button:hover{background:var(--stage-btn)}
button{font:inherit;font-family:var(--f-cjk);color:var(--fg);background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 10px;cursor:pointer}

aside{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--f-body)}
.card h2 span{font-family:var(--f-cjk);letter-spacing:0;text-transform:none;color:var(--fg);font-size:14px;margin-right:6px}
.row{display:grid;gap:6px}
.row.sub{padding-left:12px;border-left:2px solid var(--line)}
#groups{display:grid;gap:8px}
details.sec{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;font-family:var(--f-cjk);font-weight:600;font-size:14px;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
details.sec[open]>summary::before{transform:rotate(45deg)}
details.sec>summary:hover{background:var(--chip);border-radius:6px}
details.sec>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.sec-parts{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);background:var(--chip);border-radius:9px;padding:1px 7px}
.secn{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--accent);font-family:var(--f-cjk)}
.sec-body{display:grid;gap:12px;padding:4px 12px 14px}
.row-label{display:flex;justify-content:space-between;font-family:var(--f-cjk);font-size:13px}
.row-label em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:24px;height:24px;padding:0;border-radius:50%;border:1px solid var(--line)}
.pick{position:relative;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px 0 4px;border:1px solid var(--line);border-radius:12px;font-size:12px;font-family:var(--f-cjk);color:var(--muted);cursor:pointer}
.pick::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--pick,conic-gradient(#e33,#ec3,#3c5,#39e,#a3e,#e33))}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.pick.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent);color:var(--fg)}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw.metal{background:linear-gradient(135deg,#fff8 0%,transparent 35%,transparent 60%,#0005 100%),var(--c)!important}
.sw.orig{background:conic-gradient(var(--line) 0 25%,transparent 0 50%,var(--line) 0 75%,transparent 0);background-size:10px 10px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles button{border-color:var(--line)}
.toggles button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
dt{color:var(--muted);font-family:var(--f-cjk)}
dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.parts{display:flex;flex-wrap:wrap;gap:4px}
.parts span{font-family:var(--f-cjk);font-size:12px;background:var(--chip);border-radius:3px;padding:2px 6px}
.ver{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:12.5px;font-family:var(--f-cjk)}
.ver li{display:grid;grid-template-columns:52px 1fr;gap:8px}
.ver b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.ver b.cur{color:var(--accent)}
.ver span{color:var(--muted)}
.ver em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block}
.note{font-size:12px;color:var(--muted);font-family:var(--f-cjk);margin:0}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:4px;padding:10px 12px;font-size:12.5px;font-family:var(--f-cjk);display:grid;gap:4px}
.warn b{font-weight:700}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .stage{min-height:0;height:auto;position:relative;top:0}

}
.lang{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:6px}

.picker,.wrap{padding-top:56px!important}

function apply(gk,c,kind){
  const G=GROUPS.find(g=>g.key===gk);
  for(const m of byGroup[gk]||[]){
    const pbr=m.pbrMetallicRoughness;
    if(origTex.has(m) && !GROUPS.find(g=>g.key===gk).keepTex) pbr.baseColorTexture.setTexture(c?null:origTex.get(m));
    pbr.setBaseColorFactor(c?c:orig.get(m));
    if(G&&G.finish){
      const o=origMR.get(m);
      if(!c){pbr.setMetallicFactor(o[0]);pbr.setRoughnessFactor(o[1])}
      else if(kind==='m'){pbr.setMetallicFactor(1);pbr.setRoughnessFactor(o[1])}
      else{pbr.setMetallicFactor(0);pbr.setRoughnessFactor(0.45)}
    }
  }
}

function choose(gk,c,k,n){

  if(c){ SEL[gk]={c,k,n}; apply(gk,c,k); syncChildren(gk,c,n); secCount(); }

function initColorway(){
  byGroup={}; orig=new Map(); origMR=new Map(); origTex=new Map();
  for(const m of mv.model.materials){
    const hits=GROUPS.filter(g=>g.test(m.name||''));
    if(!hits.length) continue;
    const tex=m.pbrMetallicRoughness.baseColorTexture?.texture;
    for(const g of hits){
      if(tex) origTex.set(m,tex);
      (byGroup[g.key]??=[]).push(m);
      if(!orig.has(m)){orig.set(m,[...m.pbrMetallicRoughness.baseColorFactor]);origMR.set(m,[m.pbrMetallicRoughness.metallicFactor,m.pbrMetallicRoughness.roughnessFactor]);}
    }
  }
  swatches();
}

function fail(msg){const t=document.getElementById('loadtxt');t.textContent=msg;t.classList.add('err');document.getElementById('loader').hidden=false}
async function loadModel(){
  const TOTAL=S.total, MB=S.mb, bar=document.getElementById('bar'), txt=document.getElementById('loadtxt');
  try{
    const chunks=[]; let got=0;
    for(const part of (S.files||['model_a.txt','model_b.txt']).map(f=>S.base+'/'+f)){
      const res=await fetch(part);
      if(!res.ok) throw new Error(res.status);
      const reader=res.body.getReader();
      for(;;){const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length;
        const p=Math.min(got/TOTAL,1); bar.style.width=(p*100).toFixed(1)+'%'; txt.textContent=(p*MB).toFixed(1)+' / '+MB+' MB';}
    }
    txt.textContent=t('decoding');
    const b64=(await new Blob(chunks).text()).replace(/\s+/g,'');
    const bin=atob(b64); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    txt.textContent=t('decrypting');
    let blob=new Blob([await decryptBytes(bytes)]);
    const head=new Uint8Array(await blob.slice(0,2).arrayBuffer());
    if(head[0]===0x1f&&head[1]===0x8b){
      txt.textContent=t('unzipping');
      blob=await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
    }
    txt.textContent=t('building');
    modelBlob=new Blob([blob],{type:'model/gltf-binary'}); mv.src=URL.createObjectURL(modelBlob);
  }catch(e){fail(t('dlFail',e.message))}
}

const AUTH={"salt": "F8HNap3/b5IBvwjbzaXdrQ==", "iter": 600000, "entries": [{"iv": "eJy/k+4g/UBQMEvS", "wk": "GQ6UOB+gLkVvLJbrQLDI1lLiZC2zVcdEvdOeyUoehd06M+joBqweLUfLks9nATRl"}]};
const b64=s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const u8b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const URLS={}; let KEY=null;
async function unwrapKey(user,pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user+':'+pw),'PBKDF2',false,['deriveKey']);
  const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(AUTH.salt),iterations:AUTH.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const e of AUTH.entries){
    try{return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},kek,b64(e.wk)))}catch(_){}
  }
  return null;
}
async function decryptBytes(u8){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},KEY,u8.slice(12)))}
async function fetchDec(path){const r=await fetch(path);if(!r.ok)throw new Error(r.status);return decryptBytes(b64((await r.text()).trim()))}
async function decImg(st,n){
  const key=st.id+'/'+n; if(URLS[key]) return URLS[key];
  return URLS[key]=URL.createObjectURL(new Blob([await fetchDec(`${st.base}/renders/${n}.txt`)],{type:'image/jpeg'}));
}
async function unlock(raw){
  KEY=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  await Promise.all(STYLES.map(st=>decImg(st,'front34')));
  renderCards();
  showPicker();
}
function renderCards(){
  if(!STYLES.every(st=>URLS[st.id+'/front34'])) return;
  document.getElementById('cards').innerHTML=STYLES.map(st=>`
    <button class="scard" data-id="${st.id}" type="button">
      <img class="img" src="${URLS[st.id+'/front34']}" alt="${esc(st.name)} ${L('前 3/4','front 3/4')}">
      <span class="meta"><span class="nm">${esc(st.name)}</span><span class="ds">${esc(SV(st,'desc'))}</span>
      <dl class="attrs"><dt>${t('aBrand')}</dt><dd>${esc(st.brand)}</dd><dt>${t('aColor')}</dt><dd>${esc(st.color)}</dd><dt>${t('aVer')}</dt><dd>${esc(st.version)}</dd></dl>
      <span class="tags">${SV(st,'tags').map(x=>`<span>${esc(x)}</span>`).join('')}<span>${t('updated')} ${esc(st.updated)}</span></span></span>
    </button>`).join('');
  renderFilters(); applyFilters();
}
const FILT={brand:'',name:'',color:''};
const FDEF=[['brand','fBrand'],['name','fStyle'],['color','fColor']];
function fOpts(k){const m=new Map();STYLES.forEach(st=>m.set(st[k],(m.get(st[k])||0)+1));return [...m].sort((a,b)=>a[0].localeCompare(b[0],'en',{sensitivity:'base',numeric:true}));}
function renderFilters(){
  const el=document.getElementById('filters');
  el.innerHTML=FDEF.map(([k,lab])=>`<div class="dd" data-k="${k}"><button class="dd-btn" type="button" aria-haspopup="listbox" aria-expanded="false">${t(lab)}${FILT[k]?`: <span class="dd-val">${esc(FILT[k])}</span>`:''}<span class="car" aria-hidden="true">▼</span></button>
    <div class="dd-menu" role="listbox" hidden><button type="button" role="option" data-v="" aria-checked="${!FILT[k]}"><span>${t('fAll')}</span><span class="n">${STYLES.length}</span></button><hr>${fOpts(k).map(([v,n])=>`<button type="button" role="option" data-v="${esc(v)}" aria-checked="${FILT[k]===v}"><span>${esc(v)}</span><span class="n">${n}</span></button>`).join('')}</div></div>`).join('')+
    (Object.values(FILT).some(Boolean)?`<button class="f-clear" type="button" id="fClear">${t('fClear')}</button>`:'');
  el.querySelectorAll('.dd').forEach(dd=>{const b=dd.querySelector('.dd-btn'),m=dd.querySelector('.dd-menu');
    b.onclick=e=>{e.stopPropagation();const open=m.hidden;closeDD();if(open){m.hidden=false;b.setAttribute('aria-expanded','true');(m.querySelector('[aria-checked="true"]')||m.querySelector('button')).focus();}};
    m.querySelectorAll('button').forEach(o=>o.onclick=e=>{e.stopPropagation();FILT[dd.dataset.k]=o.dataset.v;renderFilters();applyFilters();el.querySelector(`.dd[data-k="${dd.dataset.k}"] .dd-btn`).focus();});});
  const c=document.getElementById('fClear'); if(c) c.onclick=()=>{FILT.brand=FILT.name=FILT.color='';renderFilters();applyFilters();};
}
function closeDD(){document.querySelectorAll('.dd-menu').forEach(m=>{m.hidden=true;m.previousElementSibling.setAttribute('aria-expanded','false');});}
document.addEventListener('click',closeDD);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.dd-menu:not([hidden])');if(o){closeDD();o.previousElementSibling.focus();}}});
function applyFilters(){
  let n=0;document.querySelectorAll('#cards .scard').forEach(c=>{const st=STYLES.find(x=>x.id===c.dataset.id);const ok=['brand','name','color'].every(k=>!FILT[k]||st[k]===FILT[k]);c.hidden=!ok;if(ok)n++;});
  const nm=document.getElementById('noMatch');nm.hidden=n>0;nm.textContent=t('noMatch');
  document.getElementById('pickerFoot').textContent=n===STYLES.length?t('count',STYLES.length):t('countF',STYLES.length,n);
}
function showPicker(){
  setMode('render');
  document.getElementById('login').hidden=true; document.getElementById('wrap').hidden=true; document.getElementById('picker').hidden=false;
}
async function openStyle(id){
  const st=STYLES.find(x=>x.id===id); if(!st) return;
  if(st!==S){
    if(loadStarted){mv.removeAttribute('src');loadStarted=false;}
    document.getElementById('loader').hidden=false; document.getElementById('bar').style.width='0';
    document.getElementById('loadtxt').classList.remove('err'); document.getElementById('loadtxt').textContent='0.0 / '+st.mb+' MB';
    byGroup={}; orig=new Map(); origMR=new Map(); origTex=new Map(); SEL={}; modelBlob=null; pendingCam=null;
    groupsEl.innerHTML=`<p class="note">${t('cwNote')}</p>`;
    S=st;
  }
  await Promise.all(VIEWS.flatMap(v=>[decImg(S,v.k+'_t'),decImg(S,v.k)]));
  renderInfo(); buildStrip(); selectView(0);
  document.getElementById('picker').hidden=true; document.getElementById('wrap').hidden=false;
  window.scrollTo(0,0);
}
document.getElementById('cards').addEventListener('click',e=>{const c=e.target.closest('.scard');if(c)openStyle(c.dataset.id)});
document.getElementById('backBtn').onclick=showPicker;
const loginForm=document.getElementById('loginForm'), loginMsg=document.getElementById('loginMsg'), goBtn=document.getElementById('goBtn');
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
  goBtn.disabled=true; goBtn.textContent=t('verifying'); loginMsg.textContent='';
  try{
    const raw=await unwrapKey(u,p);
    if(!raw){loginMsg.textContent=t('badLogin');document.getElementById('lp').select();return}
    goBtn.textContent=t('unlocking');
    await unlock(raw);
    try{sessionStorage.setItem('lk',u8b64(raw))}catch(_){}
    document.getElementById('lp').value='';
  }catch(err){loginMsg.textContent=t('unlockFail')+(err&&err.message||err)}
  finally{goBtn.disabled=false;goBtn.textContent=t('login')}
});
function doLogout(){
  try{sessionStorage.removeItem('lk')}catch(_){}
  KEY=null; Object.values(URLS).forEach(u=>URL.revokeObjectURL(u));
  if(loadStarted){mv.removeAttribute('src');loadStarted=false;document.getElementById('loader').hidden=false;document.getElementById('bar').style.width='0';}
  setMode('render'); shot.removeAttribute('src'); strip.innerHTML='';
  for(const k in URLS) delete URLS[k];
  document.getElementById('wrap').hidden=true; document.getElementById('picker').hidden=true; document.getElementById('login').hidden=false;
  document.getElementById('lu').focus();
}
document.getElementById('logout').onclick=doLogout; document.getElementById('logout2').onclick=doLogout;
function applyLang(){
  document.documentElement.lang=LANG==='en'?'en':'zh-Hant';
  document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(e=>{e.innerHTML=t(e.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.i18nAria))});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  document.getElementById('verTag').textContent=VERSION;
  document.getElementById('ver').innerHTML=CHANGELOG.map(([v,d,zh,en],i)=>`<li><b${i?'':' class="cur"'}>${v}</b><span><em>${d}</em>${esc(L(zh,en))}</span></li>`).join('');
  if(!loadStarted||!Object.keys(byGroup).length) groupsEl.innerHTML=`<p class="note">${t('cwNote')}</p>`;
  else { swatches(); for(const g of GROUPS){const v=SEL[g.key]; if(!v) continue; const r=groupsEl.querySelector(`.row[data-g="${g.key}"]`); if(!r) continue;
    const btn=r.querySelector(`.sw[data-c="${v.c}"]`); mark(r,btn||null,cLabel(g.key,v.c)); if(!btn){const pk=r.querySelector('.pick');pk&&pk.style.setProperty('--pick',v.c)} syncChildren(g.key,v.c,'');} secCount(); }
  if(KEY){ renderCards(); if(!document.getElementById('wrap').hidden){ renderInfo(); buildStrip(); selectView(cur); } }
  const lm=document.getElementById('loginMsg'); if(lm.textContent) lm.textContent='';
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l; try{localStorage.setItem('dpc_lang',LANG)}catch(_){} applyLang();});
applyLang();
(async()=>{
  let saved=null; try{saved=sessionStorage.getItem('lk')}catch(_){}
  if(saved){try{await unlock(b64(saved));return}catch(_){try{sessionStorage.removeItem('lk')}catch(__){}}}
  document.getElementById('lu').focus();
})();
</script>
