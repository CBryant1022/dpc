.scard .attrs dt{color:var(--muted);font-family:var(--f-cjk)}

.no-match{font-family:var(--f-cjk);font-size:13px;color:var(--muted);margin:0}

.lcard .lph{aspect-ratio:5/4;background:var(--stage);display:flex;align-items:center;justify-content:center}
.lcard .lph svg{width:62%;height:auto;color:#8a8f98}

<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: sample-room bench — a KeyShot-grey stage on the left (render photos or live 3D), spec card on the right; stacks on phones */
:root{
  --bg:#e9ebee; --panel:#ffffff; --fg:#1b2028; --muted:#5d6672;
  --line:#d3d8de; --accent:#d9631e; --chip:#eef0f3; --warn-bg:#fdf0e6; --warn-fg:#8a3a0c;
  --stage:#383838; --stage-fg:#eceae6; --stage-muted:#a9a6a1; --stage-line:#4c4c4c; --stage-btn:#2c2c2c;
  --f-body:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --f-cjk:"Noto Sans TC","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171c; --panel:#1f242c; --fg:#e7eaee; --muted:#9aa3ae;
  --line:#323943; --accent:#ef7a35; --chip:#272d36; --warn-bg:#3a2516; --warn-fg:#f3b38a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1f242c; --fg:#e7eaee; --muted:#9aa3ae;
  --line:#323943; --accent:#ef7a35; --chip:#272d36; --warn-bg:#3a2516; --warn-fg:#f3b38a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.wrap{align-items:start}
.stage{position:sticky;top:16px;height:calc(100vh - 32px);background:var(--stage);color:var(--stage-fg);border-radius:6px;min-height:520px;overflow:hidden;display:flex;flex-direction:column}
.stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 0;position:relative;z-index:3}
.style-id{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--stage-muted);text-transform:uppercase}
.style-id b{display:block;font-family:var(--f-body);font-size:26px;letter-spacing:.02em;color:var(--stage-fg);font-weight:600;text-transform:none}
.mode{display:flex;gap:2px;padding:3px;background:var(--stage-btn);border-radius:6px}
.mode button{color:var(--stage-muted)}
.mode button[aria-pressed="true"]{background:var(--stage-fg);color:var(--stage)}
.view{position:relative;flex:1;min-height:420px}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none!important}
/* render photo */
.photo{position:absolute;inset:0;overflow:hidden;cursor:zoom-in;touch-action:pan-y}
.photo.zoomed{cursor:zoom-out;touch-action:none}
.photo img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;transform-origin:50% 50%;transition:transform .25s ease;user-select:none;-webkit-user-drag:none}
.photo.zoomed img{transition:none}
.badge{position:absolute;right:16px;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--stage-muted);letter-spacing:.06em;pointer-events:none}
model-viewer{width:100%;height:100%;background:var(--stage);--poster-color:transparent;--progress-bar-color:transparent}
.hint{position:absolute;right:16px;top:8px;font-size:12px;color:var(--stage-muted);text-align:right;font-family:var(--f-cjk);pointer-events:none}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--stage);z-index:2}
.loader[hidden]{display:none!important}
.loader-box{width:min(280px,80%);display:grid;gap:8px;font-family:var(--f-cjk)}
.bar{height:4px;background:var(--stage-line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

let S=null;
const SV=(st,k)=>{const o=LANG==='ja'?(st.ja&&st.ja[k]!==undefined?st.ja:st.en):LANG==='en'?st.en:null;return o&&o[k]!==undefined?o[k]:st[k]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderInfo(){
  document.querySelector('.badge').textContent=t(S&&S.preview?'badgeP':'badge');
  document.getElementById('styleName').textContent=S.name;
  document.getElementById('styleMeta').textContent=[S.brand,S.color,S.version].filter(Boolean).join(' · ');
  const note=SV(S,'note');
  document.getElementById('info').innerHTML=(note?`<div class="warn"><b>${t('texSrc')}</b><span>${esc(note)}</span></div>`:'')+
    `<dl>${SV(S,'info').map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  document.getElementById('parts').innerHTML=(SV(S,'parts')||[]).map(p=>`<span>${esc(p)}</span>`).join('');
}

// views: render image + matching 3D camera orbit (toe = +X)
const VIEWS=[
  {k:'front34',zh:'前 3/4',en:'Front 3/4',orbit:'135deg 72deg auto'},
  {k:'sideL',zh:'側面 (頭朝左)',en:'Side (toe left)',orbit:'180deg 88deg auto'},
  {k:'sideR',zh:'側面 (頭朝右)',en:'Side (toe right)',orbit:'0deg 88deg auto'},
  {k:'back34',zh:'後 3/4',en:'Back 3/4',orbit:'-45deg 75deg auto'},
  {k:'front',zh:'正前',en:'Front',orbit:'90deg 85deg auto'},
  {k:'back',zh:'正後',en:'Back',orbit:'-90deg 85deg auto'},
  {k:'top',zh:'俯視',en:'Top',orbit:'180deg 3deg auto'},
  {k:'bottom',zh:'鞋底',en:'Bottom',orbit:'180deg 177deg auto'}
];
const vname=v=>L(v.zh,v.en);
const strip=document.getElementById('strip'), shot=document.getElementById('shot'), photo=document.getElementById('photo');
function buildStrip(){strip.innerHTML=VIEWS.map((v,i)=>`<button data-i="${i}" aria-pressed="${i===0}"><img src="${URLS[S.id+'/'+v.k+'_t']}" alt="" width="84" height="67">${vname(v)}</button>`).join('')}
let cur=0, mode='render';
// preload full renders
function selectView(i){
  cur=i; const v=VIEWS[i];
  strip.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.i===i));
  unzoom(); shot.src=URLS[S.id+'/'+v.k]; shot.alt=`${S.name} ${vname(v)} ${t('renderAlt')}`;
  if(mode==='3d'){mv.autoRotate=false;setPressed('tRotate',false);mv.cameraOrbit=v.orbit;mv.cameraTarget='auto auto auto';mv.fieldOfView='28deg'}
}
strip.addEventListener('click',e=>{const b=e.target.closest('button');if(b)selectView(+b.dataset.i)});

// zoom on render
let zoomed=false;
function unzoom(){zoomed=false;photo.classList.remove('zoomed');shot.style.transform=''}
function pan(e){
  const r=photo.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  shot.style.transformOrigin=`${x*100}% ${y*100}%`;
}
photo.addEventListener('click',e=>{
  if(zoomed){unzoom();return}
  zoomed=true;photo.classList.add('zoomed');pan(e);shot.style.transform='scale(2.6)';
});
photo.addEventListener('pointermove',e=>{if(zoomed)pan(e)});

// mode switch
const mv=document.getElementById('mv');
let loadStarted=false;
function setMode(m){
  mode=m;
  document.getElementById('mRender').setAttribute('aria-pressed',m==='render');
  document.getElementById('m3d').setAttribute('aria-pressed',m==='3d');
  document.getElementById('paneRender').hidden=m!=='render';
  document.getElementById('pane3d').hidden=m!=='3d';
  if(m==='3d'){ if(!loadStarted){loadStarted=true;loadModel()} }
  else unzoom();
}
document.getElementById('mRender').onclick=()=>setMode('render');
document.getElementById('m3d').onclick=()=>setMode('3d');

async function loadModel(){
  const TOTAL=S.total, MB=S.mb, bar=document.getElementById('bar'), txt=document.getElementById('loadtxt');
  try{
    const chunks=[]; let got=0;
    for(const part of (S.files||['model_a.txt','model_b.txt']).map(f=>S.base+'/'+f)){
      const res=await fetch(part);
      if(!res.ok) throw new Error(res.status);
      const reader=res.body.getReader();
      for(;;){const {done,value}=await reader.read(); if(done) break; chunks.push(value); got+=value.length;
        const p=Math.min(got/TOTAL,1); bar.style.width=(p*100).toFixed(1)+'%'; txt.textContent=(p*MB).toFixed(1)+' / '+MB+' MB';}
    }
    txt.textContent=t('decoding');
    const b64=(await new Blob(chunks).text()).replace(/\s+/g,'');
    const bin=atob(b64); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    txt.textContent=t('decrypting');
    let blob=new Blob([await decryptBytes(bytes)]);
    const head=new Uint8Array(await blob.slice(0,2).arrayBuffer());
    if(head[0]===0x1f&&head[1]===0x8b){
      txt.textContent=t('unzipping');
      blob=await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
    }
    txt.textContent=t('building');
    modelBlob=new Blob([blob],{type:'model/gltf-binary'}); mv.src=URL.createObjectURL(modelBlob);
  }catch(e){fail(t('dlFail',e.message))}
}

function azList(k){
  const L=DDL[k];
  if(!L) return `<p class="az-hint">${t('azHint')}</p>`;
  return fOpts(k).filter(([v])=>firstL(v)===L).map(([v,n])=>`<button type="button" role="option" data-v="${esc(v)}" aria-checked="${FILT[k]===v}"><span>${esc(v)}</span><span class="n">${n}</span></button>`).join('');
}
function renderFilters(){
  const el=document.getElementById('filters');
  el.innerHTML=FDEF.map(([k,lab])=>{
    const has=new Set(fOpts(k).map(([v])=>firstL(v)));
    const keys=has.has('#')?[...AZ,'#']:AZ;
    return `<div class="dd" data-k="${k}"><button class="dd-btn" type="button" aria-haspopup="true" aria-expanded="false">${t(lab)}${FILT[k]?`: <span class="dd-val">${esc(FILT[k])}</span>`:''}<span class="car" aria-hidden="true">▼</span></button>
    <div class="dd-menu az-menu" hidden>
    <div class="az" role="group" aria-label="${t(lab)} a–z">${keys.map(l=>`<button type="button" class="az-l" data-l="${l}" ${has.has(l)?'':'disabled'} aria-pressed="${DDL[k]===l}">${l}</button>`).join('')}</div>
    <div class="az-list" role="listbox">${azList(k)}</div></div></div>`}).join('')+
    (Object.values(FILT).some(Boolean)?`<button class="f-clear" type="button" id="fClear">${t('fClear')}</button>`:'');
  el.querySelectorAll('.dd').forEach(dd=>{const k=dd.dataset.k,b=dd.querySelector('.dd-btn'),m=dd.querySelector('.dd-menu');
    const bindOpts=()=>m.querySelectorAll('[role=option]').forEach(o=>o.onclick=e=>{e.stopPropagation();FILT[k]=FILT[k]===o.dataset.v?'':o.dataset.v;renderFilters();applyFilters();el.querySelector(`.dd[data-k="${k}"] .dd-btn`).focus();});
    const pick=l=>{DDL[k]=l;m.querySelectorAll('.az-l').forEach(x=>x.setAttribute('aria-pressed',x.dataset.l===l));m.querySelector('.az-list').innerHTML=azList(k);bindOpts();};
    b.onclick=e=>{e.stopPropagation();const open=m.hidden;closeDD();if(open){
      if(!DDL[k]&&FILT[k]) pick(firstL(FILT[k]));
      m.hidden=false;b.setAttribute('aria-expanded','true');(m.querySelector('.az-l[aria-pressed="true"]')||m.querySelector('.az-l:not([disabled])')||m.querySelector('button')).focus();}};
    m.onclick=e=>e.stopPropagation();
    m.querySelectorAll('.az-l').forEach(x=>x.onclick=e=>{e.stopPropagation();pick(x.dataset.l);const f=m.querySelector('.az-list [role=option]');if(f)f.focus();});
    m.onkeydown=e=>{const l=e.key.toLowerCase();if(l.length===1&&AZ.includes(l)){const x=m.querySelector(`.az-l[data-l="${l}"]:not([disabled])`);if(x){e.preventDefault();x.click();}}};
    bindOpts();});
  const c=document.getElementById('fClear'); if(c) c.onclick=()=>{FILT.brand=FILT.name=FILT.color='';DDL.brand=DDL.name=DDL.color='';renderFilters();applyFilters();};
}
function closeDD(){document.querySelectorAll('.dd-menu').forEach(m=>{m.hidden=true;m.previousElementSibling.setAttribute('aria-expanded','false');});}
document.addEventListener('click',closeDD);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.dd-menu:not([hidden])');if(o){closeDD();o.previousElementSibling.focus();}}});
function applyFilters(){
  const bs=[...new Set(STYLES.map(x=>x.brand))]; const br=FILT.brand||(bs.length===1?bs[0]:'');
  document.querySelector('.picker-title').textContent=br?t('pickTitleB',br):t('pickTitle');
  let n=0;document.querySelectorAll('#cards .scard').forEach(c=>{const st=STYLES.find(x=>x.id===c.dataset.id);const ok=['brand','name','color'].every(k=>!FILT[k]||st[k]===FILT[k]);c.hidden=!ok;if(ok)n++;});
  const nm=document.getElementById('noMatch');nm.hidden=n>0;nm.textContent=t('noMatch');
  document.getElementById('pickerFoot').textContent=n===STYLES.length?t('count',STYLES.length):t('countF',STYLES.length,n);
}
function showPicker(){
  setMode('render');
  document.getElementById('login').hidden=true; document.getElementById('wrap').hidden=true; document.getElementById('picker').hidden=false;
}
async function openStyle(id){
  const st=STYLES.find(x=>x.id===id); if(!st||st.pending) return;
  if(st!==S){
    if(loadStarted){mv.removeAttribute('src');loadStarted=false;}
    document.getElementById('loader').hidden=false; document.getElementById('bar').style.width='0';
    document.getElementById('loadtxt').classList.remove('err'); document.getElementById('loadtxt').textContent='0.0 / '+st.mb+' MB';
    byGroup={}; orig=new Map(); origMR=new Map(); origTex=new Map(); SEL={}; modelBlob=null; pendingCam=null;
    groupsEl.innerHTML=`<p class="note">${t('cwNote')}</p>`;
    S=st;
  }
  await Promise.all(VIEWS.flatMap(v=>[decImg(S,v.k+'_t'),decImg(S,v.k)]));
  renderInfo(); buildStrip(); selectView(0);
  document.getElementById('picker').hidden=true; document.getElementById('wrap').hidden=false;
  window.scrollTo(0,0);
}
document.getElementById('cards').addEventListener('click',e=>{const c=e.target.closest('.scard');if(c)openStyle(c.dataset.id)});
document.getElementById('backBtn').onclick=showPicker;
const loginForm=document.getElementById('loginForm'), loginMsg=document.getElementById('loginMsg'), goBtn=document.getElementById('goBtn');
loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
  goBtn.disabled=true; goBtn.textContent=t('verifying'); loginMsg.textContent='';
  try{
    const raw=await unwrapKey(u,p);
    if(!raw){loginMsg.textContent=t('badLogin');document.getElementById('lp').select();return}
    goBtn.textContent=t('unlocking');
    await unlock(raw);
    try{sessionStorage.setItem('lk',u8b64(raw))}catch(_){}
    document.getElementById('lp').value='';
  }catch(err){loginMsg.textContent=t('unlockFail')+(err&&err.message||err)}
  finally{goBtn.disabled=false;goBtn.textContent=t('login')}
});
function doLogout(){
  try{sessionStorage.removeItem('lk')}catch(_){}
  KEY=null; KEYS={}; ROLE=''; STYLES=[]; CHANGELOG=[]; S=null; FILT.brand=FILT.name=FILT.color=''; document.getElementById('logCard').hidden=true; document.getElementById('verWrap').hidden=true; document.getElementById('cards').innerHTML=''; Object.values(URLS).forEach(u=>URL.revokeObjectURL(u));
  if(loadStarted){mv.removeAttribute('src');loadStarted=false;document.getElementById('loader').hidden=false;document.getElementById('bar').style.width='0';}
  setMode('render'); shot.removeAttribute('src'); strip.innerHTML='';
  for(const k in URLS) delete URLS[k];
  document.getElementById('wrap').hidden=true; document.getElementById('picker').hidden=true; document.getElementById('login').hidden=false;
  document.getElementById('lu').focus();
}
document.getElementById('logout').onclick=doLogout; document.getElementById('logout2').onclick=doLogout;
function applyLang(){
  document.documentElement.lang={en:'en',zh:'zh-Hant',ja:'ja'}[LANG];
  document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(e=>{e.innerHTML=t(e.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.i18nAria))});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
  document.getElementById('verTag').textContent=VERSION;
  document.getElementById('ver').innerHTML=CHANGELOG.map(([v,d,zh,en],i)=>`<li><b${i?'':' class="cur"'}>${v}</b><span><em>${d}</em>${esc(L(zh,en))}</span></li>`).join('');
  if(!loadStarted||!Object.keys(byGroup).length) groupsEl.innerHTML=`<p class="note">${t('cwNote')}</p>`;
  else { swatches(); for(const g of GROUPS){const v=SEL[g.key]; if(!v) continue; const r=groupsEl.querySelector(`.row[data-g="${g.key}"]`); if(!r) continue;
    const btn=r.querySelector(`.sw[data-c="${v.c}"]`); mark(r,btn||null,cLabel(g.key,v.c)); if(!btn){const pk=r.querySelector('.pick');pk&&pk.style.setProperty('--pick',v.c)} syncChildren(g.key,v.c,'');} secCount(); }
  if(KEY){ renderCards(); if(!document.getElementById('wrap').hidden){ renderInfo(); buildStrip(); selectView(cur); } }
  const lm=document.getElementById('loginMsg'); if(lm.textContent) lm.textContent='';
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l; try{localStorage.setItem('dpc_lang',LANG)}catch(_){} applyLang();});
applyLang();
(async()=>{
  let saved=null; try{saved=sessionStorage.getItem('lk')}catch(_){}
  if(saved){try{await unlock(b64(saved));return}catch(_){try{sessionStorage.removeItem('lk')}catch(__){}}}
  document.getElementById('lu').focus();
})();
</script>
