    if (act === 'reset-set') { await saveSettings(clone(DEFAULT_SETTINGS)); render(); toast('已恢復預設設定'); }
  });
  function onDrop(e) { e.preventDefault(); document.body.classList.remove('dragging'); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f && (S.mode === 'local' || DB.canWrite !== false)) importFile(f); }
  document.addEventListener('dragover', e => { e.preventDefault(); if (S.mode === 'local' || DB.canWrite !== false) document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  document.addEventListener('drop', onDrop);

  const tip = () => $('#tip');
  let pinned = null;
  function tipAt(el, cx, cy) {
    const t = tip(); t.innerHTML = el.getAttribute('data-tip'); t.style.opacity = 1;
    $$('.xh.on').forEach(x => x !== el && x.classList.remove('on')); if (el.classList.contains('xh')) el.classList.add('on');
    if (cx == null) { const r = el.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top; }
    const w = t.offsetWidth, h = t.offsetHeight; let x = cx + 14, y = cy + 14;
    if (x + w > innerWidth - 8) x = cx - w - 14; if (y + h > innerHeight - 8) y = cy - h - 14; if (y < 8) y = 8; if (x < 8) x = 8;
    t.style.transform = `translate(${x}px,${y}px)`;
  }
  function tipHide() { tip().style.opacity = 0; $$('.xh.on').forEach(x => x.classList.remove('on')); $$('.pinned').forEach(x => x.classList.remove('pinned')); }
  document.addEventListener('click', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el !== pinned) { tipHide(); pinned = el; pinY = scrollY; el.classList.add('pinned'); tipAt(el, e.clientX || null, e.clientY || null); }
    else if (pinned) { pinned = null; tipHide(); }
  });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) tipAt(el); });
  document.addEventListener('focusout', e => { if (!pinned) tipHide(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (pinned || tip().style.opacity === '1')) { pinned = null; tipHide(); } });
  let pinY = 0;
  addEventListener('scroll', () => { if (pinned && Math.abs(scrollY - pinY) > 80) { pinned = null; tipHide(); } }, { passive: true });
  document.addEventListener('mousemove', e => {
    if (pinned) return;
    const el = e.target.closest && e.target.closest('[data-tip]'); const t = tip();
    if (!el) { t.style.opacity = 0; $$('.xh.on').forEach(x => x.classList.remove('on')); return; }
    $$('.xh.on').forEach(x => x !== el && x.classList.remove('on')); if (el.classList.contains('xh')) el.classList.add('on');
    t.innerHTML = el.getAttribute('data-tip'); t.style.opacity = 1;
    const w = t.offsetWidth, h = t.offsetHeight; let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    t.style.transform = `translate(${x}px,${y}px)`;
  });

  /* ---------- 本機快取（IndexedDB） ---------- */
  const IDB = {
    p: null,
    open() { if (this.p) return this.p; this.p = new Promise((res, rej) => { try { const r = indexedDB.open('dpc-monthly-report', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); return this.p; },
    async get(k) { try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (_) { return undefined; } },
    async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (_) { } }
  };

  function setData(raw) {
    S.raw = raw; S.d = hydrate(raw); kpiCache.clear(); prtCache.clear(); eqCache.clear(); lineCache.clear();
    if (!S.month || !S.d.months.includes(S.month)) { const prev = addM(CUR_M, -1); S.month = S.d.months.includes(prev) ? prev : S.d.months[S.d.months.length - 1]; }
    if (S.group !== '全部' && !S.d.groups.includes(S.group)) S.group = '全部';
    modeLine(); render();
  }
  async function saveSettings(ns) {
    ns.sv = 2; S.settings = ns; kpiCache.clear(); prtCache.clear(); eqCache.clear(); lineCache.clear();
    if (S.mode === 'shared' && DB.db && DB.canWrite !== false) { try { await DB.db.doc('settings/main').set(ns); } catch (e) { toast('設定未能同步到共享資料：' + esc(e && e.message || e)); } }
    await IDB.set('settings', ns); render();
  }
  async function saveConcl(m, items) {
    S.concl[m] = items;
    if (S.mode === 'shared' && DB.db && DB.canWrite !== false) { try { await DB.db.doc('concl/' + m).set({ items, updatedAt: new Date().toISOString() }); } catch (e) { toast('補充結論未能同步到共享資料'); } }
    await IDB.set('concl', S.concl);
  }
  async function saveNote(m, text) {
    S.notes[m] = text;
    if (S.mode === 'shared' && DB.db && DB.canWrite !== false) { try { await DB.db.doc('notes/' + m).set({ text, updatedAt: new Date().toISOString() }); } catch (e) { toast('備註未能同步到共享資料'); } }
    await IDB.set('notes', S.notes);
  }

  /* ---------- 匯入 ---------- */
  function busy(msg) { const b = $('#busy'); if (!msg) { b.hidden = true; return; } b.hidden = false; $('#busy-t').textContent = msg; }
  async function importFile(file) {
    if (!/\.xlsx$/i.test(file.name)) { toast('請選擇 .xlsx 格式的 Excel 檔案'); return; }
    if (typeof DecompressionStream === 'undefined') { toast('此瀏覽器不支援直接解析 Excel，請改用最新版 Chrome / Edge'); return; }
    busy('解析 Excel 中…');
    try {
      const raw = await DPC.parseWorkbook(await file.arrayBuffer(), { nowYear: new Date().getFullYear() });
      if (!raw.tasks.length && !raw.outputs.length) throw new Error('找不到工時日誌或產出總表，請確認檔案格式');
      raw.fileName = file.name; raw.importedAt = new Date().toISOString();
      raw.qualityCounts = raw.quality.reduce((a, x) => (a[x.t] = (a[x.t] || 0) + 1, a), {});
      S.importId = 'local-' + Date.now();
      setData(raw); await IDB.set('data', raw);
      if (S.mode === 'shared' && DB.db && DB.canWrite !== false) {
        try { await publishShared(raw); toast(`已匯入並更新共享資料：工時 ${fmt(raw.tasks.length)} 筆、產出 ${fmt(raw.outputs.length)} 筆`); }
        catch (e) { if (e && e.code === 'invalid_argument') { DB.canWrite = false; } toast('已在本機更新，但未能寫入共享資料：' + esc(e && (e.message || e.code) || e)); }
      } else toast(`已匯入：工時 ${fmt(raw.tasks.length)} 筆、產出 ${fmt(raw.outputs.length)} 筆、資料問題 ${fmt(raw.quality.length)} 項`);
    } catch (e) { toast('匯入失敗：' + esc(e && e.message || e)); }
    busy(null); modeLine(); render();
  }
  function chunk(rows, limit) {
    const enc = new TextEncoder(), out = []; let cur = [], bytes = 2;
    rows.forEach(r => { const s = JSON.stringify(r), b = enc.encode(s).length + 1; if (cur.length && bytes + b > limit) { out.push('[' + cur.join(',') + ']'); cur = []; bytes = 2; } cur.push(s); bytes += b; });
    if (cur.length) out.push('[' + cur.join(',') + ']'); return out;
  }
  async function retry(fn) { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 900)); return fn(); } throw e; } }
  async function publishShared(raw) {
    const db = DB.db, id = Date.now().toString(36);
    const ct = chunk(raw.tasks, 150000), co = chunk(raw.outputs, 150000), total = ct.length + co.length; let i = 0;
    for (const [kind, arr] of [['t', ct], ['o', co]]) for (let p = 0; p < arr.length; p++) { busy(`同步共享資料 ${++i}/${total}…`); await retry(() => db.doc(`chunks/${id}-${kind}-${p}`).set({ importId: id, kind, part: p, blob: arr[p] })); }
    busy('更新索引…');
    const meta = { schema: DPC.SCHEMA, importId: id, parts: { t: ct.length, o: co.length }, fileName: raw.fileName, importedAt: raw.importedAt, staff: raw.staff, sheets: raw.sheets, quality: raw.quality.slice(0, 400), qualityCounts: raw.qualityCounts };
    await retry(() => db.doc('meta/current').set(meta));
    S.importId = id;
    busy('清理舊版本…');
    try { const all = await db.collection('chunks').get(); for (const d of all.docs) { const x = d.data(); if (x && x.importId !== id) await retry(() => db.doc('chunks/' + d.id).delete()); } } catch (_) { }
  }
  async function upgradeShared(meta) {
    /* 共享資料是舊版格式：若頁面內建的初始資料是同一份或更新的檔案，直接用新格式重新寫入 */
    try {
      const seed = await getSeed();
      if (seed && (!meta.importedAt || seed.importedAt >= meta.importedAt || meta.fileName === seed.fileName)) { seed.seed = true; S.importId = 'seed'; setData(seed); await publishShared(seed); busy(null); toast('共享資料已更新為新版格式'); return; }
    } catch (_) { busy(null); }
    S.seeding = false; banner('共享資料是舊版格式，部分新指標（如 3D 打印 OTD）需要重新匯入一次 Excel 才會完整。', 'warn'); loadShared(meta);
  }
  async function loadShared(meta, attempt) {
    const qs = await DB.db.collection('chunks').where('importId', '==', meta.importId).get();
    const parts = qs.docs.map(d => d.data()).filter(Boolean);
    const tP = parts.filter(p => p.kind === 't').sort((a, b) => a.part - b.part), oP = parts.filter(p => p.kind === 'o').sort((a, b) => a.part - b.part);
    if (tP.length !== meta.parts.t || oP.length !== meta.parts.o) { if ((attempt || 0) < 3) { setTimeout(() => loadShared(meta, (attempt || 0) + 1), 2500); } else banner('共享資料不完整，請重新匯入一次 Excel。', 'warn'); return; }
    const raw = { tasks: [].concat(...tP.map(p => JSON.parse(p.blob))), outputs: [].concat(...oP.map(p => JSON.parse(p.blob))), staff: meta.staff || {}, sheets: meta.sheets || [], quality: meta.quality || [], qualityCounts: meta.qualityCounts, fileName: meta.fileName, importedAt: meta.importedAt };
    S.importId = meta.importId; S.loading = false; banner(null);
    setData(raw); IDB.set('data', raw);
  }
  async function initShared() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    S.loading = true;
    const timer = setTimeout(() => { if (S.loading) { S.loading = false; banner(S.d ? '共享資料暫時無法連線，目前顯示此瀏覽器上次的資料，可能不是最新。' : '共享資料暫時無法連線，請稍後再開啟。', 'warn'); render(); } }, 10000);
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      DB.user = user;
      if (user) { try { const c = await Promise.resolve(user.canEdit()); DB.canWrite = c === true ? true : c === false ? false : null; } catch (_) { } }
      if (!db) { clearTimeout(timer); S.loading = false; render(); return; }
      DB.db = db; S.mode = 'shared'; modeLine(); render();
      db.doc('meta/current').onSnapshot(snap => {
        if (!snap.metadata.fromCache) { clearTimeout(timer); }
        if (!snap.exists) { if (!snap.metadata.fromCache) { S.loading = false; if (S.raw && S.raw.seed && DB.canWrite === true && !S.seeding) { S.seeding = true; publishShared(S.raw).then(() => { busy(null); toast('已將初始資料（11.17 版）寫入共享資料庫'); modeLine(); }).catch(() => busy(null)); return; } if (S.d && DB.canWrite !== false && S.raw && S.raw.fileName && !S.raw.seed) banner('共享資料庫目前是空的，這裡顯示的是本機資料。重新匯入一次 Excel 即可讓所有人看到。', 'warn'); render(); } return; }
        const meta = snap.data(); if (!meta || meta.importId === S.importId) { S.loading = false; return; }
        if ((meta.schema || 1) < DPC.SCHEMA && DB.canWrite === true && !S.seeding) { S.seeding = true; upgradeShared(meta); return; }
        clearTimeout(timer); loadShared(meta).catch(e => banner('讀取共享資料失敗：' + esc(e && e.message || e), 'warn'));
      }, err => { clearTimeout(timer); S.loading = false; banner('共享資料連線中斷，顯示本機資料。', 'warn'); render(); });
      db.doc('settings/main').onSnapshot(s => { if (s.exists && s.data()) { const d = s.data(); if (d.targets && d.unitMap) { S.settings = migrateSettings(clone(d)); kpiCache.clear(); prtCache.clear(); eqCache.clear(); lineCache.clear(); if (S.d) render(); } } }, () => { });
      db.collection('concl').onSnapshot(qs => { const n = {}; qs.docs.forEach(d => { const x = d.data(); if (x && Array.isArray(x.items)) n[d.id] = x.items.filter(i => i && (typeof i.t === 'string' || typeof i.a === 'string')).map(i => { const o = {}; if (typeof i.a === 'string') o.a = i.a.slice(0, 20); if (i.h) o.h = 1; if (i.s) o.s = ST_TXT[i.s] || i.s === 'info' ? i.s : 'info'; if (typeof i.t === 'string') o.t = i.t.slice(0, 300); return o; }); }); S.concl = n; if (S.d && (S.route === 'overview' || S.report) && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#concl-f'))) render(); }, () => { });
      db.collection('notes').onSnapshot(qs => { const n = {}; qs.docs.forEach(d => { const x = d.data(); if (x) n[d.id] = x.text || ''; }); S.notes = n; if (S.d && (S.route === 'projects' || S.report)) render(); }, () => { });
    } catch (_) { clearTimeout(timer); S.loading = false; render(); }
  }


  /* ---------- 登入與加密初始資料 ---------- */
  const AUTH = { key: null, enc: null };
  const b64d = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const b64e = u => { let x = ''; const a = new Uint8Array(u); for (let i = 0; i < a.length; i += 0x8000) x += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(x); };
  async function fetchEnc() { if (AUTH.enc) return AUTH.enc; const r = await fetch('init-data.json', { cache: 'no-cache' }); if (!r.ok) throw new Error('seed'); AUTH.enc = await r.json(); return AUTH.enc; }
  async function deriveKey(id, pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(id.trim() + '\n' + pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decryptWith(key, e) { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(e.iv) }, key, b64d(e.data)); return JSON.parse(new TextDecoder().decode(pt)); }
  async function getSeed() { try { const e = await fetchEnc(); if (!e.enc) return null; return await decryptWith(AUTH.key, e); } catch (_) { return null; } }
  function storeGet(k) { try { return sessionStorage.getItem(k) || localStorage.getItem(k); } catch (_) { return null; } }
  function storeSet(k, v, remember) { try { (remember ? localStorage : sessionStorage).setItem(k, v); } catch (_) { } }
  function storeDel(k) { try { sessionStorage.removeItem(k); localStorage.removeItem(k); } catch (_) { } }
  async function tryStoredKey(e) {
    const k = storeGet('dpc-k'); if (!k) return false;
    try { const key = await crypto.subtle.importKey('raw', b64d(k), { name: 'AES-GCM' }, true, ['decrypt']); await decryptWith(key, e); AUTH.key = key; return true; } catch (_) { storeDel('dpc-k'); return false; }
  }
  async function login() {
    let e; try { e = await fetchEnc(); } catch (_) { e = null; }
    if (!e || !e.enc) return; /* 無加密初始資料（舊版部署）時不擋 */
    if (await tryStoredKey(e)) return;
    const g = $('#gate'); g.hidden = false; document.body.classList.add('locked');
    const f = $('#gate-f'), msg = $('#gate-msg'); setTimeout(() => f.elements.id.focus(), 50);
    await new Promise(done => {
      f.onsubmit = async ev => {
        ev.preventDefault(); const id = f.elements.id.value, pw = f.elements.pw.value;
        if (!id || !pw) { msg.textContent = '請輸入帳號與密碼'; return; }
        const btn = f.querySelector('button'); btn.disabled = true; msg.textContent = '驗證中…';
        try {
          const key = await deriveKey(id, pw, b64d(e.salt), e.iter); await decryptWith(key, e);
          AUTH.key = key; storeSet('dpc-k', b64e(await crypto.subtle.exportKey('raw', key)), f.elements.rem.checked);
          g.hidden = true; document.body.classList.remove('locked'); f.reset(); msg.textContent = ''; done();
        } catch (_) { msg.textContent = '帳號或密碼錯誤'; f.elements.pw.value = ''; f.elements.pw.focus(); }
        btn.disabled = false;
      };
    });
  }
  async function logout() { storeDel('dpc-k'); try { await IDB.set('data', null); } catch (_) { } location.reload(); }

  async function loadSeed() {
    try { const raw = await getSeed(); if (!raw) return; raw.seed = true; S.importId = 'seed'; S.raw = raw; S.d = hydrate(raw); kpiCache.clear(); prtCache.clear(); eqCache.clear(); lineCache.clear(); const prev = addM(CUR_M, -1); S.month = S.d.months.includes(prev) ? prev : S.d.months[S.d.months.length - 1]; } catch (_) { }
  }
  /* ---------- 啟動 ---------- */
  const gIdx = g => g === '全部' ? 0 : (S.d ? S.d.groups.indexOf(g) + 1 : 0);
  function hashFor(r) { if (!S.d || !S.month || r === 'data') return r; const gi = gIdx(S.group); return r + '-' + S.month.replace('-', '') + (gi > 0 ? '-g' + gi : ''); }
  let skipHash = false;
  function syncHash() { const h = hashFor(S.route); if (location.hash.slice(1) !== h) { skipHash = true; location.hash = h; } }
  function route() {
    const h = (location.hash || '').slice(1); const mm = /^([a-z]+)(?:-(\d{4})(\d{2}))?(?:-g(\d+))?$/.exec(h) || [];
    S.route = ROUTES.some(r => r.id === mm[1]) ? mm[1] : 'overview';
    if (S.d) {
      if (mm[2]) { const m = mm[2] + '-' + mm[3]; if (S.d.months.includes(m)) S.month = m; }
      if (mm[1] && mm[1] !== 'data') { const gi = +(mm[4] || 0); S.group = gi > 0 && S.d.groups[gi - 1] ? S.d.groups[gi - 1] : '全部'; kpiCache.clear(); prtCache.clear(); eqCache.clear(); lineCache.clear(); }
    }
    render(); syncHash();
  }
  async function boot() {
    await login();
    const lo = $('#logout'); if (lo) { lo.hidden = !AUTH.key; lo.onclick = e => { e.preventDefault(); logout(); }; }
    $('#nav').innerHTML = ROUTES.map(r => `<a href="#${r.id}" data-r="${r.id}"${r.id === 'data' ? ' class="sep"' : ''}><span>${r.n || '⚙'}</span>${r.t}</a>`).join('');
    $('#msel').onchange = e => { S.month = e.target.value; render(); syncHash(); };
    $('#gsel').onchange = e => { S.group = e.target.value; kpiCache.clear(); prtCache.clear(); eqCache.clear(); lineCache.clear(); render(); syncHash(); };
    const setProj = on => { document.body.classList.toggle('proj', on); const pb = $('#proj'); pb.classList.toggle('on', on); pb.setAttribute('aria-pressed', on ? 'true' : 'false'); try { localStorage.setItem('dpc-proj', on ? '1' : ''); } catch (_) { } };
    let pj = false; try { pj = localStorage.getItem('dpc-proj') === '1'; } catch (_) { } setProj(pj);
    $('#proj').onclick = () => { setProj(!document.body.classList.contains('proj')); render(); };
    $('#rep').onclick = () => { S.report = !S.report; if (S.route === 'data') location.hash = 'overview'; render(); window.scrollTo(0, 0); };
    $('#fi').onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
    window.addEventListener('hashchange', () => { if (skipHash) { skipHash = false; return; } S.report = false; route(); window.scrollTo(0, 0); });
    const [d, st, nt, cc] = await Promise.all([IDB.get('data'), IDB.get('settings'), IDB.get('notes'), IDB.get('concl')]);
    if (cc) S.concl = cc;
    if (st && st.targets) S.settings = migrateSettings(st); if (nt) S.notes = nt;
    if (d && d.tasks) { S.importId = 'cache'; S.raw = d; S.d = hydrate(d); const prev = addM(CUR_M, -1); S.month = S.d.months.includes(prev) ? prev : S.d.months[S.d.months.length - 1]; }
    if (!S.raw) await loadSeed();
    modeLine(); route();
    initShared();
  }
  boot();
})();
</script>
</body>
