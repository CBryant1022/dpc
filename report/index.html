<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Product Creation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#f3f2ef;--surface:#fcfcfb;--card:#ffffff;--line:#e4e2dc;--line2:#efede8;
  --text:#0b0b0b;--text2:#4a4946;--muted:#6b6a65;--side:#1d2430;--side2:#2a3342;--sidet:#c9d1dc;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--neutral:#c4c2bb;
  --good:#0ca30c;--good-t:#006300;--data-t:#7a5b00;--warn:#fab219;--warn-t:#8a5a00;--bad:#d03b3b;--bad-t:#b42828;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--card:#1f1f1e;--line:#34332f;--line2:#2a2a28;--text:#f0efec;--text2:#c9c8be;--muted:#a3a29b;--side:#0e1218;--side2:#1a212c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--neutral:#5c5b57;--good-t:#3fc43f;--warn-t:#fab219;--bad-t:#ff7a7a;--accent:#3987e5}}
*{box-sizing:border-box}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}.chart .hit:focus-visible{outline:none}.chart .hit:focus-visible rect:first-child,.chart .hit.pinned rect:first-child{fill:color-mix(in srgb,var(--accent) 10%,transparent)}.chart .hit{cursor:pointer}@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}[hidden]{display:none!important}
body{margin:0;font:14px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sidet);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.5px}.brand span{font-size:12px;opacity:.7}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--sidet);text-decoration:none;font-size:14px}
.nav a span{font:600 11px/1 ui-monospace,Menlo,monospace;opacity:.6;width:20px}
.nav a:hover{background:var(--side2);color:#fff}.nav a.on{background:var(--accent);color:#fff}.nav a.on span{opacity:1}
.nav a.sep{margin-top:10px;border-top:1px solid #ffffff1a;padding-top:14px;border-radius:0 0 8px 8px}
.side .foot{margin-top:auto;font-size:12px;padding:0 8px;display:flex;flex-direction:column;gap:4px;opacity:.85}
main{min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1 .num{font:600 13px ui-monospace,Menlo,monospace;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:3px 7px;border-radius:6px}
.top h1 small{font-size:13px;font-weight:400;color:var(--text2)}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.btn,input,textarea{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:120px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost.on{background:var(--text);color:var(--card);border-color:var(--text)}
.btn.sm{padding:6px 12px;font-size:13px}
.banner{background:color-mix(in srgb,var(--warn) 16%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.tile-l{font-size:13px;color:var(--text2)}.tile-v{font-size:30px;font-weight:700;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile-v small{font-size:13px;font-weight:500;color:var(--text2);margin-left:4px}.tile-x{font-size:12px;color:var(--muted)}
.tile-h{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;flex-wrap:wrap;min-height:22px}.tile-list{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:3px}.tile-list li{display:flex;gap:5px;align-items:baseline;font-size:12px}.tile-list span{white-space:nowrap;min-width:4.2em;color:var(--text2)}.tile-list em{margin-left:auto;white-space:nowrap}.tile-list b{font-size:18px;font-variant-numeric:tabular-nums}.tile-list small{color:var(--text2)}.tile-list em{font-style:normal;color:var(--text2);font-size:12px;text-align:right}
.dl{color:var(--text2)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px 1px 2px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:var(--card)}
.st b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px}
.st-data b{background:var(--neutral);color:var(--text)}.st-data{color:var(--text2);border-style:dashed}.warn-t{color:var(--warn-t);font-weight:600}.st-good b{background:var(--good)}.st-good{color:var(--good-t)}.st-warn b{background:var(--warn);color:#3a2a00}.st-warn{color:var(--warn-t)}.st-bad b{background:var(--bad)}.st-bad{color:var(--bad-t)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;min-width:0}
.g2>.card,.g3>.card{margin-bottom:0}.g2.wide{grid-template-columns:minmax(0,2fr) minmax(280px,1fr)}@media (max-width:1100px){.g2.wide{grid-template-columns:1fr}}
.card header{margin-bottom:10px}.card h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}.card header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.oc-v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.oc-v small{font-size:13px;color:var(--text2);margin-left:4px;font-weight:500}.oc-d{font-size:12px;margin-bottom:4px}.mini{font-size:12px;color:var(--text2);margin-bottom:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;flex:none}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line2);stroke-width:1}.chart .ax{fill:var(--muted);font-size:11px}.chart .axhi{fill:var(--text);font-weight:700}
.chart .vl{fill:var(--text);font-size:12px;font-weight:700}.chart .el{fill:var(--text2);font-size:11px}
.chart .tgt{stroke:var(--text2);stroke-dasharray:4 4;stroke-width:1}
.chart .cross{stroke:var(--text2);stroke-width:1;opacity:0}.chart .xh.on .cross{opacity:.5}
.chart .hit:hover path{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text2);margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stk{display:flex;flex-direction:column;gap:7px}
.stk-r{display:grid;grid-template-columns:96px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.stk-r label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stk-r small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.stk-r.strong{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.stk-b{display:flex;gap:2px;height:22px}.stk-b span{border-radius:3px;min-width:2px;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;text-shadow:0 0 3px #0006}
.stk-b em{color:var(--muted);font-size:12px}
.hb{display:flex;flex-direction:column;gap:6px}.hb-r{display:grid;grid-template-columns:minmax(90px,36%) 1fr 52px;gap:10px;align-items:center;font-size:13px}
.hb-r label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb-t{height:14px}.hb-t span{display:block;height:100%;border-radius:0 4px 4px 0}.hb-r small{text-align:right;color:var(--text2);font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:560px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:500;color:var(--text2);border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
.tbl th small{font-weight:400;color:var(--muted)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}#wtb td:nth-child(-n+4){white-space:nowrap}.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{border-top:1px solid var(--line);font-weight:500}.tbl .empty{text-align:center;color:var(--muted);padding:18px}
.tbl tbody tr:hover td{background:var(--surface)}
.ctx{font-size:12px;color:var(--text2)}.ctv{margin-top:6px;font-size:12px}.ctv summary{cursor:pointer;color:var(--text2);display:inline-block;padding:4px 0}.ctv summary:hover{color:var(--text)}.ctv .tbl{font-size:12px}.ctv .tbl td,.ctv .tbl th{padding:4px 6px}.g2.inner{gap:18px;margin:0}.g2.inner h4{margin:0 0 8px;font-size:13px;color:var(--text2);font-weight:500}.heat td{text-align:right;border-bottom:1px solid var(--card);border-right:1px solid var(--card)}.srch{margin-top:6px;width:min(420px,100%);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit}
.good-t{color:var(--good-t);white-space:nowrap}.bad-t{color:var(--bad-t);white-space:nowrap}.muted{color:var(--muted)}
.manc{border-top:1px dashed var(--line);margin:12px 0;padding-top:12px}.manc-h{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;font-size:13px}.manc-act{margin-left:auto;display:flex;gap:4px;flex:none}.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:2px 4px;border-radius:4px}.lnk:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}.concl li.editing{background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:6px}.manc-f{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.manc-f select{min-width:0;padding:6px 8px}.manc-f input{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;font-size:14px}.st-track b{background:var(--accent)}.st-track{color:var(--accent)}.concl{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:9px}
.concl li{display:flex;gap:10px;align-items:flex-start;font-size:14px}.concl li .st{margin-top:2px}
.ci{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--text2);font:700 11px Georgia,serif;flex:none;margin-top:2px}
.dz{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:24px;cursor:pointer;margin-bottom:14px;background:var(--surface)}
.dz:hover,body.dragging .dz{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}.dz span{font-size:12px;color:var(--muted)}.dz.big{padding:44px}
.hero{max-width:760px;margin:40px auto;text-align:center}.hero h2{font-size:24px;margin:0 0 8px}.hero p{color:var(--text2)}
.steps{text-align:left;display:inline-flex;flex-direction:column;gap:6px;color:var(--text2);margin:0 auto}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 12px;margin:0 0 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.qi{border-bottom:1px solid var(--line2);padding:6px 0}.qi summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.qi ul{margin:6px 0 4px;padding-left:18px;font-size:12px;max-height:240px;overflow:auto}.badge{background:var(--line);border-radius:999px;padding:0 8px;font-size:12px}
.setf{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 18px;font-size:13px}
.setf select{min-width:0;padding:5px 8px}.setf input{width:70px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.setf .full{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}.setf .row.full{flex-direction:row}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font:13px/1.6 inherit;resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:8px}.notebox{white-space:normal;font-size:14px;line-height:1.8}
.def{margin:0;padding-left:18px;font-size:13px;color:var(--text2);display:flex;flex-direction:column;gap:4px}
.page{margin-bottom:34px}.ph{display:flex;align-items:center;gap:12px;margin:8px 0 14px;padding-bottom:8px;border-bottom:2px solid var(--text)}
.ph span{font:700 13px ui-monospace,Menlo,monospace;background:var(--text);color:var(--card);padding:3px 8px;border-radius:6px}.ph h2{margin:0;font-size:19px}.ph h2 small{font-size:12px;font-weight:400;color:var(--text2);margin-left:8px}
.tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--text);color:var(--card);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.5;opacity:0;transition:opacity .08s;z-index:50;max-width:280px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--card);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:70}.busy div{background:var(--card);padding:18px 26px;border-radius:12px;font-weight:500}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}main{min-width:0}.side{min-width:0;position:sticky;top:0;z-index:30;height:auto;flex-direction:column;gap:6px;padding:10px 0 6px}.brand{padding:0 14px}.brand span{display:none}.nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:0 10px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.nav::-webkit-scrollbar{display:none}.nav a{white-space:nowrap;padding:8px 12px;flex:none}.nav a span{display:none}.nav a.sep{margin:0;border:0;padding-top:8px;border-radius:8px}.side .foot{display:none}main{padding:14px}.top{gap:10px}.ctl{margin-left:0;width:100%}#ctl{display:flex;gap:8px;width:100%}#ctl[hidden]{display:none}#ctl select{flex:1;min-width:0}.chart .ax{font-size:17px}.chart .xo:not(.axhi){display:none}.chart .vl{font-size:18px}.chart .el{font-size:16px}.tile-v{font-size:26px}.stk-r{grid-template-columns:72px 1fr 52px}.hb-r{grid-template-columns:minmax(70px,34%) 1fr 46px}}
@media (forced-colors:active){.stk-b span,.hb-t span{border:1px solid CanvasText}}
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate[hidden]{display:none}body.locked .app{visibility:hidden}
.gate-c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(360px,100%);box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate-c h2{margin:0 0 4px;font-size:20px}.gate-c p{margin:0 0 18px;color:var(--text2);font-size:13px}
.gate-c label{display:block;font-size:13px;color:var(--text2);margin:10px 0 4px}
.gate-c input[type=text],.gate-c input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.gate-c .rem{display:flex;gap:6px;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--text2)}
.gate-c .btn{width:100%;justify-content:center;padding:10px}#gate-msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--bad,#c0392b)}
.prt3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 4px}.prt3>div{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;line-height:1.3}.prt3 span{display:block;font-size:12px;color:var(--text2)}.prt3 b{font-size:18px}.prt3 small{display:block;font-size:11px;color:var(--muted)}
.tbl tr.hl2 td{background:color-mix(in srgb,var(--bad) 15%,transparent)}.tbl tr.hl1 td{background:color-mix(in srgb,var(--warn) 16%,transparent)}.tbl tbody tr.hl2:hover td{background:color-mix(in srgb,var(--bad) 24%,transparent)}.tbl tbody tr.hl1:hover td{background:color-mix(in srgb,var(--warn) 26%,transparent)}
.hlb{display:inline-block;font-size:11px;line-height:1;padding:3px 5px;border-radius:4px;margin-left:4px;vertical-align:1px;font-weight:600}.hlb2{background:var(--bad);color:#fff}.hlb1{background:var(--warn);color:#3a2a00}
.hlk{white-space:nowrap}.hlk i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 2px 0 4px;vertical-align:-1px}.hlk i.hl2{background:color-mix(in srgb,var(--bad) 45%,transparent)}.hlk i.hl1{background:color-mix(in srgb,var(--warn) 55%,transparent)}
.concl li{border-radius:6px;padding:2px 4px;margin:0 -4px}.concl li .ctx{flex:1;min-width:0}.drag{cursor:grab;color:var(--muted);font-size:12px;letter-spacing:-2px;padding:3px 2px 0;user-select:none;flex:none}.concl li.dragging{opacity:.45}.concl li.drop-a{box-shadow:0 -2px 0 var(--accent)}.concl li.drop-b{box-shadow:0 2px 0 var(--accent)}
.ctag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;white-space:nowrap}.ctag.ed{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}.ctag.man{color:var(--text2)}
.lnk-sp{display:inline-block;width:22px}.manc-act .lnk{min-width:22px}
@media (max-width:700px){.concl li{flex-wrap:wrap}.concl li .manc-act{width:100%;justify-content:flex-end}}
.brand .logo{display:block;height:48px;width:auto;background:#fff;border-radius:10px;padding:5px 8px;margin-bottom:10px}
.brand b{font-size:16px;line-height:1.3}
.gate-logo{display:block;height:56px;width:auto;margin:0 0 14px}
@media (max-width:860px){.brand{display:flex;align-items:center;gap:10px}.brand .logo{height:30px;padding:3px 5px;border-radius:7px;margin:0}.brand b{font-size:15px}}
/* 版面：中等寬度螢幕 KPI 卡片一行 3 張，避免擠 */
@media (max-width:1700px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 投影模式：整體放大、單欄排列 */
body.proj main{zoom:1.2}@media (min-width:1600px){body.proj main{zoom:1.4}}@media (min-width:2200px){body.proj main{zoom:1.7}}
body.proj .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
body.proj .g2,body.proj .g2.wide{grid-template-columns:minmax(0,1fr)}
body.proj .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
body.proj .card header p{font-size:13px}
@media (max-width:1100px){body.proj main{zoom:1}body.proj .g3{grid-template-columns:minmax(0,1fr)}}

<script>/* ===== DPC 月報平台：Excel 解析核心（瀏覽器 / Node 共用） ===== */
(function (G) {
  'use strict';

  /* ---------- 簡繁正規化（人名、欄位名比對用） ---------- */
  const T2S_PAIRS = '稱称斬斩編编錄录續续劉刘謙谦飛飞韋韦黃黄陳陈楊杨計计畫划劃划實实際际單单號号掃扫碼码數数時时間间請请線线製制圖图業业類类項项內内組组進进學学習习導导專专題题決决議议會会達达頁页條条錄录區区機机設设備备動动層层輔辅說说視视訊讯細细點点種种與与為为開开發发轉转應应後后頭头舊旧樣样紙纸據据總总師师葉叶豐丰鄭郑趙赵錢钱孫孙吳吴張张蘭兰雲云鍾钟蕭萧羅罗盧卢樂乐麗丽偉伟軍军強强華华謝谢馮冯鄧邓歐欧衛卫勝胜龍龙鳳凤瑋玮濤涛靜静潔洁穎颖寧宁鳴鸣馬马劍剑嶽岳鵬鹏輝辉紅红紀纪純纯貴贵艷艳蓮莲鳥鸟鵝鹅貝贝費费錦锦劑剂廣广門门們们傑杰鑫鑫倫伦國国慶庆財财寶宝嬌娇維维賢贤顏颜選选擇择級级階阶標标準准參参則则據据個个體体戶户產产質质檢检驗验號号碼码';
  const T2S = {};
  for (let i = 0; i + 1 < T2S_PAIRS.length; i += 2) T2S[T2S_PAIRS[i]] = T2S_PAIRS[i + 1];
  function simp(s) { s = String(s == null ? '' : s); let o = ''; for (const ch of s) o += T2S[ch] || ch; return o; }
  function norm(s) { return simp(s).replace(/[\s　]+/g, '').replace(/（/g, '(').replace(/）/g, ')').toLowerCase(); }

  /* ---------- 精簡 XLSX 讀取（無外部套件） ---------- */
  async function inflateRaw(u8) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([u8]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  async function openZip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let e = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) { if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; } }
    if (e < 0) throw new Error('不是有效的 .xlsx 檔案（請另存為 Excel 活頁簿 .xlsx）');
    const n = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true);
    const files = new Map(), td = new TextDecoder();
    for (let k = 0; k < n; k++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
      const nl = dv.getUint16(off + 28, true), xl = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
      const loff = dv.getUint32(off + 42, true);
      files.set(td.decode(u8.subarray(off + 46, off + 46 + nl)), { method, csize, loff });
      off += 46 + nl + xl + cl;
    }
    return {
      async text(name) {
        const f = files.get(name); if (!f) return null;
        const lnl = dv.getUint16(f.loff + 26, true), lxl = dv.getUint16(f.loff + 28, true);
        const st = f.loff + 30 + lnl + lxl, data = u8.subarray(st, st + f.csize);
        return td.decode(f.method === 0 ? data : await inflateRaw(data));
      }
    };
  }
  function xd(s) {
    return s.replace(/&(lt|gt|amp|quot|apos|#x[0-9a-fA-F]+|#[0-9]+);/g, (m, k) => {
      if (k === 'lt') return '<'; if (k === 'gt') return '>'; if (k === 'amp') return '&';
      if (k === 'quot') return '"'; if (k === 'apos') return "'";
      return String.fromCodePoint(k[1] === 'x' ? parseInt(k.slice(2), 16) : parseInt(k.slice(1), 10));
    }).replace(/_x000D_/g, '');
  }
  function attr(s, name) { const m = new RegExp('(?:^|\\s)' + name + '="([^"]*)"').exec(s); return m ? xd(m[1]) : null; }
  function colIdx(ref) { let n = 0; for (const ch of ref) { const c = ch.charCodeAt(0); if (c < 65 || c > 90) break; n = n * 26 + (c - 64); } return n - 1; }

  async function readWorkbook(buf) {
    const zip = await openZip(buf);
    const ssXml = await zip.text('xl/sharedStrings.xml');
    const ss = [];
    if (ssXml) {
      const re = /<si>([\s\S]*?)<\/si>/g; let m;
      while ((m = re.exec(ssXml))) {
        const body = m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
        let t = ''; const rt = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g; let k;
        while ((k = rt.exec(body))) t += k[1];
        ss.push(xd(t));
      }
    }
    const wb = await zip.text('xl/workbook.xml');
    const rels = await zip.text('xl/_rels/workbook.xml.rels');
    const relMap = {};
    (rels.match(/<Relationship\b[^>]*>/g) || []).forEach(r => { relMap[attr(r, 'Id')] = attr(r, 'Target'); });
    const sheets = [];
    for (const tag of (wb.match(/<sheet\b[^>]*>/g) || [])) {
      const name = attr(tag, 'name'), rid = attr(tag, 'r:id');
      let target = relMap[rid] || ''; target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
      sheets.push({ name, path: target });
    }
    async function rows(path) {
      const xml = await zip.text(path); if (!xml) return [];
      const out = [];
      const reRow = /<row\b([^>]*)>([\s\S]*?)<\/row>/g; let rm;
      while ((rm = reRow.exec(xml))) {
        const r = parseInt(attr(rm[1], 'r'), 10) - 1; const row = [];
        const reC = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
        while ((cm = reC.exec(rm[2]))) {
          const ref = attr(cm[1], 'r'); if (!ref) continue;
          const t = attr(cm[1], 't'), inner = cm[2] || '';
          let v = null; const vm = /<v>([\s\S]*?)<\/v>/.exec(inner);
          if (t === 's') v = vm ? ss[parseInt(vm[1], 10)] : null;
          else if (t === 'inlineStr') { const tm = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/.exec(inner); v = tm ? xd(tm[1]) : null; }
          else if (t === 'str' || t === 'e') v = vm ? xd(vm[1]) : null;
          else if (t === 'b') v = vm ? vm[1] === '1' : null;
          else if (vm) { const num = Number(vm[1]); v = isNaN(num) ? xd(vm[1]) : num; }
          if (v !== null && v !== '') row[colIdx(ref)] = v;
        }
        out[r] = row;
      }
      for (let i = 0; i < out.length; i++) if (!out[i]) out[i] = [];
      return out;
    }
    return { sheets, rows };
  }

  /* ---------- 日期工具 ---------- */
  const DAY = 86400000;
  function iso(d) { return d.toISOString().slice(0, 10); }
  function fromSerial(v) { return iso(new Date(Date.UTC(1899, 11, 30) + Math.round(v * DAY))); }
  function toDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') { if (v > 20000 && v < 80000) return fromSerial(v); return null; }
    const m = /(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/.exec(String(v));
    if (m) { const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return isNaN(d) ? null : iso(d); }
    return null;
  }
  function toHours(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return v * 24;
    const m = /(\d+):(\d{1,2})(?::(\d{1,2}))?/.exec(String(v));
    return m ? (+m[1]) + (+m[2]) / 60 + (+(m[3] || 0)) / 3600 : null;
  }
  function toNum(v) { if (typeof v === 'number') return v; if (v == null) return null; const n = parseFloat(String(v).replace(/[^\d.\-]/g, '')); return isNaN(n) ? null : n; }
  function dnum(s) { return Date.parse(s + 'T00:00:00Z') / DAY; }
  const WD = { '日': 0, '天': 0, '一': 1, 'ㄧ': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6 };
  function parseLabel(v) {
    if (v == null) return null; const s = String(v);
    const m = /^\s*(\d{1,2})\s*\/\s*0*(\d{1,2})/.exec(s); if (!m) return null;
    const mo = +m[1], d = +m[2]; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const w = /[（(]\s*([日天一ㄧ二三四五六])/.exec(s);
    return { mo, d, w: w ? WD[w[1]] : null, raw: s.replace(/\s+/g, '') };
  }

  /* 依「順序連續 + 星期吻合」推斷年份，並標記錯置的日期欄 */
  function resolveYears(labels, nowYear) {
    let best = null;
    for (let S = nowYear - 3; S <= nowYear + 1; S++) {
      const ds = []; let score = 0, hist = [];
      labels.forEach((L, i) => {
        let dn;
        if (i === 0) dn = dnum(`${S}-${String(L.mo).padStart(2, '0')}-${String(L.d).padStart(2, '0')}`);
        else {
          const ref = hist.slice(-3).sort((a, b) => a - b)[Math.min(1, hist.slice(-3).length - 1)];
          const y0 = new Date(ref * DAY).getUTCFullYear(); let bd = null, bdist = 1e9;
          for (const y of [y0 - 1, y0, y0 + 1]) {
            const c = dnum(`${y}-${String(L.mo).padStart(2, '0')}-${String(L.d).padStart(2, '0')}`);
            if (Math.abs(c - ref) < bdist) { bdist = Math.abs(c - ref); bd = c; }
          }
          dn = bd;
        }
        ds.push(dn); hist.push(dn);
        if (L.w != null && new Date(dn * DAY).getUTCDay() === L.w) score++;
      });
      if (!best || score > best.score) best = { score, ds };
    }
    const ds = best.ds, stray = ds.map(() => false);
    for (let i = 0; i < ds.length; i++) {
      const fp = i === 0 || Math.abs(ds[i] - ds[i - 1]) > 35, fn = i === ds.length - 1 || Math.abs(ds[i] - ds[i + 1]) > 35;
      if (fp && fn && ds.length > 1) stray[i] = true;
    }
    let mx = -1e9;
    for (let i = 0; i < ds.length; i++) { if (stray[i]) continue; if (ds[i] < mx - 3) stray[i] = true; else mx = Math.max(mx, ds[i]); }
    return labels.map((L, i) => ({ date: iso(new Date(ds[i] * DAY)), stray: stray[i], wdOk: L.w == null || new Date(ds[i] * DAY).getUTCDay() === L.w }));
  }

  /* ---------- 人員 ---------- */
  function parsePerson(v) {
    if (v == null) return null; const raw = String(v);
    const cleaned = raw.replace(/(部門主管|小組長|組長|助理|實習|專員|主管|經理|师傅|師傅)/g, ' ').trim();
    const m = /^([一-鿿]{2,4})/.exec(cleaned); if (!m) return null;
    const g = /[（(]([^)）]+)[)）]/.exec(raw); const gr = g ? g[1].replace(/\s+/g, ' ').trim() : '';
    let group = '其他';
    if (/A\s*組/.test(gr)) group = 'A組 逆建模'; else if (/B\s*組/.test(gr)) group = 'B組 Ai圖稿';
    else if (/主管/.test(gr + raw)) group = '部門主管'; else if (/新[進进]/.test(gr)) group = '新進人員'; else if (gr) group = gr;
    const role = (/(部門主管|小組長|組長|助理|實習|專員|主管)/.exec(raw) || [])[1] || '';
    return { name: m[1], key: simp(m[1]), group, role };
  }
  function splitMakers(v) {
    if (v == null) return [];
    return String(v).split(/[\/、,，&+＋\s]+/).map(s => s.trim()).filter(s => /^[一-鿿]{2,4}$/.test(s));
  }

  /* ---------- 作業類別歸類 ---------- */
  const CAT_ORDER = ['直接作業', '問題解決（檢驗/校正）', '專項工作', '培訓練習', '指導教學', '管理/會議', '休假'];
  function catBucket(c) {
    const s = String(c || '');
    if (/^直接作業/.test(s)) return '直接作業';
    if (/問題解決|问题解决/.test(s)) return '問題解決（檢驗/校正）';
    if (/專項|专项/.test(s)) return '專項工作';
    if (/培訓|培训|練習/.test(s)) return '培訓練習';
    if (/指導|指导|教學/.test(s)) return '指導教學';
    if (/休假|請假|请假|年假|病假|事假/.test(s)) return '休假';
    return '管理/會議';
  }

  /* ---------- 工時日誌解析 ---------- */
  function parseLogSheet(sheetName, rows, nowYear, Q, out) {
    const R2 = rows[1] || [], R3 = rows[2] || [];
    const nameCols = [], catCols = [];
    for (let i = 0; i < Math.max(R2.length, R3.length); i++) {
      if (R2[i] === '姓名') nameCols.push(i);
      if (R3[i] === '作業類別') catCols.push(i);
    }
    if (!nameCols.length || !catCols.length) return false;
    const blocks = [];
    for (const c of catCols) {
      let lab = parseLabel(R2[c]), lc = c;
      if (!lab) { lab = parseLabel(R2[c - 1]); lc = c - 1; }
      if (!lab) { Q.push({ t: '日期欄缺標題', s: sheetName, d: `第 ${colName(c)} 欄有「作業類別」但找不到日期標題，已略過` }); continue; }
      const nc = nameCols.filter(x => x < c).pop(); if (nc == null) continue;
      blocks.push({ c, lab, lc, nc });
    }
    const res = resolveYears(blocks.map(b => b.lab), nowYear);
    const carry = {};
    blocks.forEach((b, i) => {
      const R = res[i];
      if (R.stray) { Q.push({ t: '錯置日期欄', s: sheetName, d: `${colName(b.lc)} 欄「${b.lab.raw}」與前後日期不連續（疑似範本殘留），已略過` }); return; }
      if (!R.wdOk) Q.push({ t: '星期標示不符', s: sheetName, d: `${colName(b.lc)} 欄「${b.lab.raw}」→ 判定為 ${R.date}，但星期不符` });
      let cur = null;
      for (let r = 3; r < rows.length; r++) {
        const row = rows[r]; if (!row) continue;
        const p = parsePerson(row[b.nc]); if (p) cur = p;
        const cat = row[b.c], sub = row[b.c + 1], con = row[b.c + 2], hv = row[b.c + 3];
        if ((cat == null || cat === '') && (hv == null || hv === '')) continue;
        const h = toNum(hv);
        if (!cur) continue;
        if (/進度表|进度表|日誌表|日志表|累計/.test(String(cat || ''))) continue;
        if (cat == null && !h) continue;
        out.push({ src: sheetName + '!' + b.c, date: R.date, key: cur.key, name: cur.name, group: cur.group, role: cur.role,
          cat: String(cat == null ? '' : cat).trim(), sub: String(sub == null ? '' : sub).trim(), con: String(con == null ? '' : con).replace(/\s+/g, ' ').trim().slice(0, 80), h: h || 0, missingH: h == null });
      }
    });
    return true;
  }
  function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }

  /* ---------- 產出總表解析 ---------- */
  const OUT_DEFS = [
    { line: '印刷圖稿', unit: '筆', sheet: /印刷圖稿|印刷图稿/, plan: ['计划完成日期', '计画完成日期', '需求日期'], actual: ['实际完成日期'], maker: ['制作人'], desc: ['斩刀编号', '部位'], extra: { kn: ['斩刀编号'], sg: ['段别数量', '段数量'], cl: ['颜色数量', '颜色数'], ver: ['版号'], typ: ['基本码/全套/特殊号码', '基本码/全套'], cat: ['需求类别'], dep: ['申请单位'], part: ['部位'] } },
    { line: '位置版', unit: '筆', sheet: /位置版/, plan: ['需求日期', '计划完成日期'], actual: ['完成日期', '实际完成日期'], maker: ['制作人'], desc: ['斩刀编号', '部位'] },
    { line: '劃線模', unit: '單', sheet: /画线模|劃線模|划线模/, stages: ['3d打印', '3d建模', '3d扫描'], maker: ['制作人'], desc: ['斩刀编号', '基本码全套'] },
    { line: '3D建模', unit: '件', sheet: /3D建模/i, plan: ['计划完成日期'], actual: ['实际完成日期'], maker: ['制作人'], desc: ['斩刀编号', '号码'] },
    { line: '3D掃描', unit: '件', sheet: /3D掃描|3D扫描/i, plan: ['计划完成日期'], actual: ['实际完成日期'], maker: ['扫描人'], desc: ['斩刀编号', '号码'], tags: [['部件名称'], ['参照标准']] },
    { line: '3D打印', unit: '只', sheet: /3D打印/i, actual: ['打印完成时间'], maker: ['打印人', '制作人'], qty: ['只数'], desc: ['斩刀编号', '鞋码'], print: true }
  ];
  function parseOutSheet(def, sheetName, rows, Q, out) {
    let hr = -1;
    for (let r = 0; r < Math.min(6, rows.length); r++) if ((rows[r] || []).some(v => norm(v) === '接单日期')) { hr = r; break; }
    if (hr < 0) { Q.push({ t: '產出表結構', s: sheetName, d: '找不到「接單日期」表頭，此表未匯入' }); return; }
    const H = rows[hr] || [], S = rows[hr + 1] || [];
    const hasSub = S.some(v => /计划|实际/.test(norm(v)));
    const names = []; let grp = '';
    const seen = {};
    for (let c = 0; c < Math.max(H.length, S.length); c++) {
      if (H[c] != null && H[c] !== '') grp = norm(H[c]);
      let n = hasSub && S[c] != null && /计划|实际/.test(norm(S[c])) ? grp + '|' + norm(S[c]) : norm(H[c]);
      if (!n) { names[c] = ''; continue; }
      seen[n] = (seen[n] || 0) + 1; names[c] = seen[n] > 1 ? n + '#' + seen[n] : n;
    }
    const find = (cands) => { for (const cd of cands || []) { const k = names.findIndex(n => n === norm(cd)); if (k >= 0) return k; } return -1; };
    const ci = { part: find(['部件名称']), id: find(['单号']), o: find(['接单日期']), p: find(def.plan), a: find(def.actual), m: find(def.maker), q: find(def.qty), d: (def.desc || []).map(x => find([x])).filter(x => x >= 0) };
    let st = null;
    if (def.stages) st = def.stages.map(sg => ({ p: names.findIndex(n => n === sg + '|计划完成日期'), a: names.findIndex(n => n === sg + '|实际完成日期') }));
    let pc = {};
    const tc = def.tags ? def.tags.map(cd => find(cd)) : null;
    const xc = def.extra ? { kn: find(def.extra.kn), sg: find(def.extra.sg), cl: find(def.extra.cl), ver: find(def.extra.ver), typ: find(def.extra.typ), cat: find(def.extra.cat), dep: find(def.extra.dep), part: find(def.extra.part) } : null;
    if (def.print) pc = { u: find(['需求单位']), g: find(['实际耗材/g']), ml: find(['实际耗材/ml']), t1: find(['打印时间']), t2: find(['打印时间#2']), pr: find(['打印机']) };
    const start = hr + (hasSub ? 2 : 1);
    let n = 0, lastB = null, noTime = 0;
    for (let r = start; r < rows.length; r++) {
      const row = rows[r] || []; if (!row.length) continue;
      const o = toDate(row[ci.o]);
      let p = ci.p >= 0 ? toDate(row[ci.p]) : null, a = ci.a >= 0 ? toDate(row[ci.a]) : null;
      let pp = null;
      if (st && st[0] && st[0].p >= 0) pp = toDate(row[st[0].p]);
      if (st) { for (const s of st) { const sp = s.p >= 0 ? toDate(row[s.p]) : null, sa = s.a >= 0 ? toDate(row[s.a]) : null; if (sp || sa) { p = sp; a = sa; break; } } }
      if (!o && !a) continue;
      const desc = ci.d.map(k => row[k]).filter(x => x != null && x !== '').join(' ').replace(/\s+/g, ' ').slice(0, 60);
      const rec = { part: ci.part >= 0 && row[ci.part] != null ? String(row[ci.part]).trim() : '', id: ci.id >= 0 && row[ci.id] != null ? String(row[ci.id]).trim() : '', pp, l: def.line, o, p, a, m: ci.m >= 0 && row[ci.m] != null ? String(row[ci.m]).trim() : '', q: ci.q >= 0 ? (toNum(row[ci.q]) || 1) : 1, k: desc };
      if (tc) rec.x = tc.map(k => k >= 0 && row[k] != null ? String(row[k]).trim() : '');
      if (xc) { const sv = k => k >= 0 && row[k] != null ? String(row[k]).trim() : ''; rec.x = [sv(xc.kn), xc.sg >= 0 ? toNum(row[xc.sg]) : null, xc.cl >= 0 ? toNum(row[xc.cl]) : null, sv(xc.ver), sv(xc.typ), sv(xc.cat), sv(xc.dep), sv(xc.part)]; }
      if (def.print) {
        rec.g = toNum(row[pc.g]) || 0; rec.ml = toNum(row[pc.ml]) || 0; rec.ph = (toHours(row[pc.t1]) || 0) + (toHours(row[pc.t2]) || 0); rec.pr = row[pc.pr] != null ? String(row[pc.pr]).trim() : '';
        const u = pc.u >= 0 && row[pc.u] != null ? String(row[pc.u]).trim().toUpperCase() : ''; rec.u = /^(DTC|DTP|DJC)$/.test(u) ? u : (u && u !== '/' ? '其他' : '未填');
        /* 同一批次（如 Form 4L 一次打多只）：時間只填在第一列，下方空白列屬於同一批 */
        if (rec.ph > 0) { rec.b = 'r' + r; lastB = { pr: rec.pr, a, id: rec.b }; }
        else if (lastB && lastB.pr === rec.pr && lastB.a === a) rec.b = lastB.id;
        else { rec.b = ''; noTime++; }
      }
      if (o && a && a < o) Q.push({ t: '完成日早於接單日', s: sheetName, d: `第 ${r + 1} 列 ${desc}：接單 ${o}、完成 ${a}` });
      if (!rec.m) Q.push({ t: '產出缺負責人', s: sheetName, d: `第 ${r + 1} 列 ${desc} 未填${(def.maker || [])[0] || '負責人'}` });
      out.push(rec); n++;
    }
    if (noTime) Q.push({ t: '打印缺時間', s: sheetName, d: `${noTime} 筆打印紀錄沒有打印時間，也不屬於上方同機台同日的批次` });
    return n;
  }

  /* ---------- 主流程 ---------- */
  async function parseWorkbook(buf, opts) {
    opts = opts || {};
    const nowYear = opts.nowYear || new Date().getFullYear();
    const wb = await readWorkbook(buf);
    const Q = [], raw = [], outputs = [], sheetsUsed = [];
    let valid = null;
    for (const sh of wb.sheets) {
      const nm = sh.name;
      if (/下拉清單|下拉清单/.test(nm)) {
        const rows = await wb.rows(sh.path); const cats = new Set(), subs = new Set();
        let cc = -1; rows.forEach(r => { r.forEach((v, i) => { if (cc < 0 && v === '作業類別') cc = i; }); });
        rows.forEach(r => r.forEach((v, i) => { if (v == null) return; const s = String(v).trim(); if (i === cc) cats.add(s); else subs.add(s); }));
        cats.delete('作業類別'); subs.delete('作業分類'); valid = { cats, subs };
        continue;
      }
      const def = OUT_DEFS.find(d => d.sheet.test(nm));
      if (def) { const rows = await wb.rows(sh.path); const n = parseOutSheet(def, nm, rows, Q, outputs); if (n != null) sheetsUsed.push({ name: nm, kind: '產出：' + def.line, rows: n }); continue; }
      const rows = await wb.rows(sh.path);
      const before = raw.length;
      if (parseLogSheet(nm, rows, nowYear, Q, raw) && raw.length > before) sheetsUsed.push({ name: nm, kind: '工時日誌', rows: raw.length - before });
    }
    /* 3D 打印計畫日：用单号對回画线模总表的「3D打印 計畫完成日期」 */
    const ppMap = {}, hxIds = new Set(); outputs.forEach(o => { if (o.l === '劃線模' && o.id) { if (/鞋头|后包|鞋垫|鞋頭|後包|鞋墊/.test(o.part)) hxIds.add(o.id); if (o.pp) ppMap[o.id] = o.pp; } });
    outputs.forEach(o => { if (o.l === '3D打印') o.hx = !!(o.id && hxIds.has(o.id)); });
    let linked = 0, printRows = 0;
    outputs.forEach(o => { if (o.l === '3D打印') { printRows++; if (o.id && ppMap[o.id]) { o.p = ppMap[o.id]; linked++; } } });
    if (printRows) Q.push({ t: '3D打印計畫日對應', s: '3D打印總表', d: `${linked}/${printRows} 筆可依单号對到画线模总表的「3D打印 計畫完成日期」；其餘因画线模总表未填打印計畫日，不列入 3D 打印 OTD` });
    /* 同一人同一天若出現在多個來源（重複週區塊 / 週表與總表），保留工時較多的來源 */
    const bySrc = new Map();
    raw.forEach(t => { const k = t.key + '|' + t.date; if (!bySrc.has(k)) bySrc.set(k, new Map()); const m = bySrc.get(k); m.set(t.src, (m.get(t.src) || 0) + t.h); });
    const keep = new Map(); let dupDays = 0;
    bySrc.forEach((m, k) => { let bs = null, bh = -1; m.forEach((h, s) => { if (h > bh) { bh = h; bs = s; } }); keep.set(k, bs); if (m.size > 1) dupDays++; });
    if (dupDays) Q.push({ t: '重複日期資料', s: '工時日誌', d: `${dupDays} 個「人員×日期」同時出現在多個日期欄（例如週區塊重複的 6/16），已只保留工時較多的一份` });
    const tasks = raw.filter(t => keep.get(t.key + '|' + t.date) === t.src);
    /* 品質檢查 */
    if (valid) {
      const badC = {}, badS = {};
      tasks.forEach(t => { if (t.cat && !valid.cats.has(t.cat)) badC[t.cat] = (badC[t.cat] || 0) + 1; if (t.sub && !valid.subs.has(t.sub)) badS[t.sub] = (badS[t.sub] || 0) + 1; });
      Object.entries(badC).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => Q.push({ t: '作業類別不在下拉清單', s: '工時日誌', d: `「${k}」${v} 筆` }));
      Object.entries(badS).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => Q.push({ t: '作業分類不在下拉清單', s: '工時日誌', d: `「${k}」${v} 筆` }));
    }
    const day = new Map();
    tasks.forEach(t => { const k = t.name + '|' + t.date; day.set(k, (day.get(k) || 0) + t.h); });
    day.forEach((h, k) => { if (h > 12) { const [n, d] = k.split('|'); Q.push({ t: '單日工時 > 12h', s: '工時日誌', d: `${n} ${d}：${h} h` }); } });
    const missH = tasks.filter(t => t.missingH && t.cat).length;
    if (missH) Q.push({ t: '缺工時', s: '工時日誌', d: `${missH} 筆有作業類別但未填工時（以 0 計）` });
    /* 人員主檔 */
    const staff = {};
    tasks.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(t => { staff[t.key] = { name: t.name, group: t.group, role: t.role, first: (staff[t.key] || {}).first || t.date, last: t.date }; });
    const unknown = {};
    outputs.forEach(o => splitMakers(o.m).forEach(m => { if (!staff[simp(m)]) unknown[m] = (unknown[m] || 0) + 1; }));
    Object.entries(unknown).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => Q.push({ t: '產出人員不在工時日誌', s: '產出總表', d: `「${k}」${v} 筆（工時日誌姓名欄未列此人，分組統計時歸入「其他」）` }));
    return {
      tasks: tasks.map(t => [t.date, t.key, t.cat, t.sub, t.con, Math.round(t.h * 100) / 100]),
      outputs: outputs.map(o => [o.l, o.o, o.p, o.a, o.m, o.q, o.k, o.g || 0, o.ml || 0, Math.round((o.ph || 0) * 100) / 100, o.pr || '', o.b || '', o.l === '3D打印' ? (o.hx ? o.u : 'x') : '', o.x || 0]),
      staff, quality: Q, sheets: sheetsUsed
    };
  }

  G.DPC = { parseWorkbook, simp, splitMakers, catBucket, CAT_ORDER, OUT_DEFS: OUT_DEFS.map(d => ({ line: d.line, unit: d.unit, otd: true })), SCHEMA: 7 };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* ===== DPC 月報平台：介面與統計 ===== */
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (v, d = 0) => v == null || !isFinite(v) ? '—' : Number(v).toLocaleString('zh-TW', { maximumFractionDigits: d, minimumFractionDigits: d });

    o = o || {};
    return `<div class="tw"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr class="${r._cls || ''}">${cols.map((c, i) => `<td class="${c.n ? 'n' : ''}">${r[i] == null ? '—' : r[i]}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">${o.empty || '本月無資料'}</td></tr>`}</tbody></table></div>`;
  }
  const card = (title, sub, body, cls) => `<section class="card ${cls || ''}"><header><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</header>${body}</section>`;
  function tile(label, value, unit, extra, st) { return `<div class="tile"><div class="tile-h"><span class="tile-l">${label}</span>${st ? chip(st) : ''}</div><div class="tile-v">${value}<small>${unit || ''}</small></div><div class="tile-x">${extra || ''}</div></div>`; }

  /* ---------- 結論產生 ---------- */
  /* 培訓標準：培訓練習工時 ÷ 總投入工時 ≥ trainPct% 即達標 */
  const trainSt = K => K.hours ? { r: K.training / K.hours, st: K.training / K.hours >= tg('trainPct') / 100 ? 'good' : 'bad' } : null;
  function conclusions(m) {
    const K = kpi(m), P = kpi(addM(m, -1)), t = S.settings.targets, list = [];
    /* 直接作業、問題解決、OTD 標準尚未訂立：只陳述數字，不判定達標 */
    if (K.direct != null) list.push(['info', `直接作業佔比 ${pct(K.direct)}${P.direct != null ? `（上月 ${pct(P.direct)}）` : ''}。`, 'direct']);
    if (K.problem != null) list.push(['info', `問題解決（檢驗/校正）佔 ${pct(K.problem)}${P.problem != null ? `（上月 ${pct(P.problem)}）` : ''}。`, 'problem']);
    const so = otdSt(K.otdAll, K.otdCov);
    const lowCov = OTD_LINES.filter(l => K.otd[l].done >= 5 && !covOk(K.otd[l].cov));
    if (lowCov.length) list.push(['data', `計畫日覆蓋率不足 ${tg('otdCov')}%：${lowCov.map(l => `${l} ${pct(K.otd[l].cov, 0)}（${K.otd[l].n}/${K.otd[l].done}）`).join('、')}，這些業務線的 OTD 僅供參考，請補填計畫完成日。`, 'otdcov']);
    if (so && so !== 'data') {
      const worst = OTD_LINES.filter(l => K.otd[l].n >= 3).sort((a, b) => K.otd[a].rate - K.otd[b].rate)[0];
      list.push(['info', `交期達成率 OTD ${pct(K.otdAll)}（${K.otdN} 筆有計畫日）${worst && K.otd[worst].late ? `；最弱為 ${worst} ${pct(K.otd[worst].rate)}，逾期 ${K.otd[worst].late} 筆` : '，無逾期'}。`, 'otd']);
    }
    const mv = LINES.filter(l => P.out[l] >= 5).map(l => ({ l, d: (K.out[l] - P.out[l]) / P.out[l] })).filter(x => Math.abs(x.d) >= 0.15).sort((a, b) => Math.abs(b.d) - Math.abs(a.d))[0];
    if (mv) list.push(['info', `${mv.l} 完成 ${fmt(K.out[mv.l])} ${UNIT[mv.l]}，較上月${mv.d > 0 ? '增加' : '減少'} ${Math.abs(mv.d * 100).toFixed(0)}%。`, 'move']);
    const EQ = equip(m), el = Object.entries(EQ.res).filter(([, x]) => x.h > 0).sort((a, b) => a[1].util - b[1].util);
    if (el.length) { const [lo, x] = el[0], [hi, y] = el[el.length - 1]; list.push([status(y.util, tg('equipU'), true) || 'info', `3D 打印稼動率：最高 ${hi} ${pct(y.util)}、最低 ${lo} ${pct(x.util)}（目標 ≥ ${tg('equipU')}%，以每日 ${tg('equipH')} h 計）。`, 'equip']); }
    const tr = trainSt(K); if (tr) list.push([tr.st, `培訓練習 ${fmt(K.training, 1)} h，佔總投入工時 ${pct(tr.r)}，${tr.st === 'good' ? '達到' : '未達'}每月 ≥ ${tg('trainPct')}% 標準。`, 'train']);
    return list.filter(x => x[0] !== 'data');
  }

  /* 重點結論：自動結論＋手動結論合併成一個可排序清單。
     儲存格式（依月份）：[{a:'direct', s?, t?, h?}, {s, t}, …]；a＝自動結論代號，s／t 有值代表已手動修改，h＝隱藏 */
  function mergedConcl(m) {
    const auto = conclusions(m), A = new Map(auto.map(([s, t, k]) => [k, { s, t }]));
    const saved = (S.concl[m] || []).filter(Boolean), hasA = saved.some(e => e.a), out = [];
    const put = (k, e) => { const x = A.get(k); if (!x) return; A.delete(k); if (e && e.h) return; out.push({ a: k, s: (e && e.s) || x.s, t: (e && e.t) || x.t, ed: !!(e && (e.t || e.s)), autoS: x.s, autoT: x.t }); };
    if (!hasA) auto.forEach(([, , k]) => put(k));
    saved.forEach(e => { if (e.a) { if (A.has(e.a)) put(e.a, e); } else if (typeof e.t === 'string') out.push({ s: e.s || 'info', t: e.t }); });
    [...A.keys()].forEach(k => { const e = saved.find(x => x.a === k); if (!(e && e.h)) put(k); });
    const hidden = saved.filter(e => e.a && e.h && conclusions(m).some(c => c[2] === e.a)).length;
    return { list: out, hidden };
  }
  function conclToSaved(m, list, extraHidden) {
    const prevHidden = (S.concl[m] || []).filter(e => e && e.a && e.h).map(e => e.a);
    const vis = new Set(list.filter(x => x.a).map(x => x.a));
    const hid = [...new Set(prevHidden.concat(extraHidden || []))].filter(k => !vis.has(k));
    return list.map(x => { if (!x.a) return { s: x.s, t: x.t }; const e = { a: x.a }; if (x.s !== x.autoS) e.s = x.s; if (x.t !== x.autoT) e.t = x.t; return e; }).concat(hid.map(k => ({ a: k, h: 1 })));
  }
  const conclText = m => mergedConcl(m).list.map((c, i) => `${i + 1}. ${c.t}${c.a ? '' : `（${ST_TXT[c.s] ? ST_TXT[c.s][1] : '資訊'}）`}`);

  /* ---------- 各模塊 ---------- */
  function vOverview(m) {
    const K = kpi(m), P = kpi(addM(m, -1)), t = S.settings.targets, M12 = back(m, 12);
    const tiles = [
      tile('總投入工時', fmt(K.hours, 0), 'h', `${delta(K.hours, P.hours)}<br>${K.people} 人 · ${K.days} 個工作日`),
      tile('直接作業佔比', pct(K.direct), '', `${delta(K.direct, P.direct, 'pt')}`),
      tile('問題解決（檢驗/校正）佔比', pct(K.problem), '', `${delta(K.problem, P.problem, 'pt')}`),
      tile('交期達成率 OTD', pct(K.otdAll), '', `${delta(K.otdAll, P.otdAll, 'pt')}<br>計畫日覆蓋 ${pct(K.otdCov, 0)}`, otdSt(K.otdAll, K.otdCov) === 'data' ? 'data' : null),
      (() => { const hs = hxSup(m), hp = hxSup(addM(m, -1)); const li = [['印刷圖稿', K.out['印刷圖稿'], P.out['印刷圖稿'], '筆'], ['劃線模', hs, hp, '支'], ['3D建模', K.out['3D建模'], P.out['3D建模'], '件']];
        return `<div class="tile"><div class="tile-h"><span class="tile-l">主要產出</span></div><ul class="tile-list">${li.map(([n, v, p, u]) => `<li><span>${n}</span><b>${fmt(v)}</b><small>${u}</small><em>${p ? (v === p ? '持平' : `${v > p ? '▲' : '▼'} ${Math.abs((v - p) / p * 100).toFixed(0)}%`) : '—'}</em></li>`).join('')}</ul><div class="tile-x">其他業務線見「產出量」</div></div>`; })(),
      (() => { const tr = trainSt(K); return tile('培訓＋指導工時', fmt(K.training + K.coaching, 1), 'h', `${delta(K.training + K.coaching, P.training + P.coaching)}<br>培訓 ${fmt(K.training, 1)} · 指導 ${fmt(K.coaching, 1)}${tr ? `<br>培訓佔總工時 ${pct(tr.r)}（標準 ≥ ${tg('trainPct')}%）` : ''}`, tr && tr.st); })()
    ].join('');
    const canEditC = S.mode === 'local' || DB.canWrite !== false;
    const MC = mergedConcl(m), CL = MC.list;
    const CST = [['good', '達標'], ['warn', '接近'], ['bad', '未達'], ['track', '待追蹤'], ['info', '資訊']];
    const badge = s => s === 'info' ? '<b class="ci">i</b>' : chip(s);
    const ed = S.cedit != null && CL[S.cedit] ? CL[S.cedit] : null;
    const tag = x => x.a ? (x.ed ? '<small class="ctag ed">自動・已修改</small>' : '<small class="ctag">自動</small>') : '<small class="ctag man">手動</small>';
    const act = (x, i) => canEditC && !S.report ? `<span class="manc-act">${i > 0 ? `<button class="lnk" data-act="concl-up" data-i="${i}" aria-label="第 ${i + 1} 則上移" title="上移">↑</button>` : '<span class="lnk-sp"></span>'}${i < CL.length - 1 ? `<button class="lnk" data-act="concl-down" data-i="${i}" aria-label="第 ${i + 1} 則下移" title="下移">↓</button>` : '<span class="lnk-sp"></span>'}<button class="lnk" data-act="concl-edit" data-i="${i}" aria-label="編輯第 ${i + 1} 則">編輯</button>${x.a && x.ed ? `<button class="lnk" data-act="concl-reset" data-i="${i}" aria-label="第 ${i + 1} 則還原自動文字">還原</button>` : ''}<button class="lnk" data-act="concl-del" data-i="${i}" aria-label="${x.a ? '隱藏' : '刪除'}第 ${i + 1} 則">${x.a ? '隱藏' : '刪除'}</button></span>` : '';
    const conHtml = CL.length ? `<ul class="concl" id="concl-list">${CL.map((x, i) => `<li class="c-${x.s}${S.cedit === i ? ' editing' : ''}" data-i="${i}"${canEditC && !S.report ? ' draggable="true"' : ''}>${canEditC && !S.report ? '<span class="drag" aria-hidden="true" title="拖曳排序">⋮⋮</span>' : ''}${badge(x.s)}<span class="ctx">${esc(x.t)}${canEditC && !S.report ? ' ' + tag(x) : ''}</span>${act(x, i)}</li>`).join('')}</ul>` : '<p class="muted">本月尚無結論，可在下方新增。</p>';
    const manHtml = canEditC && !S.report ? `<div class="manc"><div class="manc-h"><b>${ed ? `編輯第 ${S.cedit + 1} 則` : '新增結論'}</b><span class="muted">${ed && ed.a ? '修改後不再隨數據自動更新，可按「還原」恢復' : '可拖曳 ⋮⋮ 或用 ↑↓ 調整順序'}${MC.hidden ? ` · 已隱藏 ${MC.hidden} 則自動結論 <button class="lnk" data-act="concl-unhide">全部顯示</button>` : ''}</span></div>
      <form class="manc-f" id="concl-f"><select name="s" aria-label="狀態">${CST.map(([k, v]) => `<option value="${k}" ${(ed ? ed.s : 'track') === k ? 'selected' : ''}>${v}</option>`).join('')}</select><input name="t" maxlength="300" placeholder="例：Form 4L 稼動偏低，12 月起排夜間批次…" value="${ed ? esc(ed.t) : ''}" aria-label="結論內容" autocomplete="off"><button class="btn sm" type="submit">${ed ? '儲存修改' : '新增'}</button>${ed ? '<button class="btn ghost sm" type="button" data-act="concl-cancel">取消</button>' : ''}</form></div>` : (canEditC ? '' : '<p class="muted" style="font-size:12px">結論由部門管理者編輯</p>');
    const outRows = LINES.map(l => [`<i class="dot" style="background:${LINE_COLOR[l]}"></i>${l}`, fmt(K.out[l]), fmt(P.out[l]), P.out[l] ? (K.out[l] === P.out[l] ? '持平' : `${K.out[l] > P.out[l] ? '▲' : '▼'} ${Math.abs((K.out[l] - P.out[l]) / P.out[l] * 100).toFixed(0)}%`) : '—', UNIT[l]]);
    return `<div class="tiles">${tiles}</div>
      <div class="g2">${card('本月重點結論', '自動結論依目標值判定，可直接編輯、隱藏、調整順序；也可新增手動結論，依月份保存', conHtml + manHtml + `<button class="btn ghost sm" data-act="copy-summary">複製月報摘要</button>`)}
      ${card('產出摘要', '本月 vs 上月（依實際完成日期）', table([{ h: '業務線' }, { h: '本月', n: 1 }, { h: '上月', n: 1 }, { h: '變化', n: 1 }, { h: '單位' }], outRows))}</div>
      <div class="g2">${card('近 12 個月總投入工時', '單位：h', barTrend(M12, M12.map(x => kpi(x).hours), { hi: 11, unit: 'h', color: 'var(--s1)' }))}
      ${card('近 12 個月工時結構趨勢', '佔有效工時比例（不含休假）', legend([['直接作業', CAT_COLOR['直接作業']], ['問題解決（檢驗/校正）', CAT_COLOR['問題解決（檢驗/校正）']]]) + lineChart(M12, [{ name: '直接作業', color: CAT_COLOR['直接作業'], values: M12.map(x => kpi(x).direct) }, { name: '問題解決（檢驗/校正）', color: CAT_COLOR['問題解決（檢驗/校正）'], values: M12.map(x => kpi(x).problem) }], { yMax: 1, fmt: v => (v * 100).toFixed(0) + '%', hi: 11, endLabels: true }))}</div>`;
  }

  function vOutput(m) {
    const K = kpi(m), P = kpi(addM(m, -1)), M12 = back(m, 12);
    const hSer = [{ name: '合計', color: 'var(--text)', values: M12.map(x => kpi(x).eff || null) }].concat(LINES.map(l => ({ name: l, color: LINE_COLOR[l], values: M12.map(x => kpi(x).lineH[l]) })), [{ name: '其他', color: 'var(--neutral)', values: M12.map(x => kpi(x).lineH['其他']) }]);
    const hRows = LINES.concat('其他').map(l => [`<i class="dot" style="background:${LINE_COLOR[l] || 'var(--neutral)'}"></i>${l}`, fmt(K.lineH[l], 1), fmt(P.lineH[l], 1), K.eff ? pct(K.lineH[l] / K.eff) : '—']);
    const hourCard = `<div class="g2 wide">${card('月度投入工時曲線（依業務線）', `近 12 個月有效工時（不含休假）；本月合計 ${fmt(K.eff, 1)} h；工時依作業分類歸入業務線（劃線模的掃描／建模／打印工時多記在「3D FDM- 劃線模」，所以歸在劃線模），對應規則可在設定調整`, legend(hSer.map(x => [x.name, x.color])) + lineChart(M12, hSer, { hi: 11, h: 240, w: 760, fmt: v => fmt(v, 0) }))}
      ${card('本月投入工時', '', table([{ h: '業務線' }, { h: '本月 h', n: 1 }, { h: '上月 h', n: 1 }, { h: '佔比', n: 1 }], hRows))}</div>`;
    const UNITS = ['DTC', 'DTP', 'DJC', '其他', '未填'], UCOL = { DTC: 'var(--s1)', DTP: 'var(--s2)', DJC: 'var(--s3)', '其他': 'var(--s7)', '未填': 'var(--neutral)' };
    const hxU = mm => { const o = {}; UNITS.forEach(u => o[u] = { q: 0, n: 0 }); S.d.outputs.forEach(x => { if (x.l === '3D打印' && x.am === mm && x.u && x.u !== 'x' && outOk(x)) { const k = o[x.u] ? x.u : '其他'; o[k].q += x.q; o[k].n++; } }); return o; };
    const HU = hxU(m), HP = hxU(addM(m, -1)), hTot = sum(UNITS.map(u => HU[u].q));
    const hasU = M12.some(x => sum(UNITS.map(u => hxU(x)[u].q)) > 0);
    const hxCard = hTot || sum(UNITS.map(u => HP[u].q)) ? card('劃線模支數｜依需求單位', `依 3D 打印總表「需求單位」與只數統計（只計单号對應到画线模总表、部件為鞋頭／後包片／鞋墊的打印）；「未填」= 需求單位空白或填「/」`, table([{ h: '需求單位' }, { h: '本月支數', n: 1 }, { h: '打印筆數', n: 1 }, { h: '佔比', n: 1 }, { h: '上月支數', n: 1 }, { h: '變化', n: 1 }], UNITS.filter(u => HU[u].q || HP[u].q).map(u => [`<i class="dot" style="background:${UCOL[u]}"></i><b>${u}</b>`, `<b>${fmt(HU[u].q)}</b>`, fmt(HU[u].n), hTot ? pct(HU[u].q / hTot, 0) : '—', fmt(HP[u].q), HP[u].q ? `${HU[u].q >= HP[u].q ? '▲' : '▼'} ${Math.abs((HU[u].q - HP[u].q) / HP[u].q * 100).toFixed(0)}%` : '—']).concat([Object.assign(['<b>合計</b>', `<b>${fmt(hTot)}</b>`, fmt(sum(UNITS.map(u => HU[u].n))), '', fmt(sum(UNITS.map(u => HP[u].q))), ''], { _cls: 'tot' })]))) : '';
    const prSplit = mm => { const r = { hx: 0, other: 0 }; S.d.outputs.forEach(x => { if (x.l === '3D打印' && x.am === mm && outOk(x)) { if (x.u && x.u !== 'x') r.hx += x.q; else r.other += x.q; } }); return r; };
    const PS = prSplit(m);
    const HX = K.hxProc, SC = scanStd(O_done(m).filter(o => o.l === '3D掃描'));
    const hoursLine = l => {
      if (l === '劃線模') return `<div class="mini">投入工時 ${fmt(K.lineH[l], 1)} h${K.out[l] && K.lineH[l] >= 10 ? ` · 每單 ${fmt(K.lineH[l] / K.out[l], 1)} h` : ''}</div>${K.lineH[l] ? `<div class="mini">工序：${['繪製建模', '3D 打印', '檢查修改', '3D 掃描'].map(p => `${p.replace('3D ', '')} <b>${fmt(HX[p], 0)}</b>`).join(' · ')}${HX['其他'] ? ` · 其他 ${fmt(HX['其他'], 0)}` : ''} h</div>` : ''}`;
      if (l === '3D打印') { const ph = HX['3D 打印'], q = K.out[l]; return `<div class="mini">人員操作 <b>${fmt(ph, 1)}</b> h（含在劃線模工時內）${q && ph ? ` · 每只 ${fmt(ph / q, 2)} h` : ''}${K.lineH[l] ? ` · 另其他打印 ${fmt(K.lineH[l], 1)} h` : ''}</div>`; }
      if (l === '3D掃描') { const sh = HX['3D 掃描'] + K.lineH[l], q = K.out[l], wm = tg('scanWhite'), wTxt = wm % 60 ? fmt(wm / 60, 1) + ' h' : (wm / 60) + ' h';
        return `<div class="mini">人員掃描 <b>${fmt(sh, 1)}</b> h（含在劃線模工時內）${q ? ` · 標準 ${fmt(SC.h, 1)} h` : ''}</div>${q ? `<div class="mini">標準：劃線模 ${fmt(SC.hx)} 尺碼 × ${tg('scanMin')} 分鐘${SC.wh ? ` ＋ 白模 ${fmt(SC.wh)} 件 × ${wTxt}` : `（白模 ${wTxt}／件，本月 0 件）`}</div>` : ''}${q && sh ? `<div class="mini">實際 ÷ 標準 <b>${pct(sh / SC.h, 0)}</b>${!SC.wh ? ` · 每尺碼 ${fmt(sh * 60 / q, 1)} 分鐘` : ''}</div>` : ''}`; }
      if (l === '印刷圖稿') { const A = prt(m), B = prt(addM(m, -1)); const dv = (a, b) => b ? ` <span style="font-size:12px;color:var(--text2)">${a >= b ? '▲' : '▼'}${Math.abs((a - b) / b * 100).toFixed(0)}%</span>` : '';
        const base = `<div class="mini">投入工時 ${fmt(K.lineH[l], 1)} h${K.out[l] && K.lineH[l] >= 10 ? ` · 每筆 ${fmt(K.lineH[l] / K.out[l], 2)} h` : ''}</div>`;
        if (!A.n) return base; if (!A.has) return base + '<div class="mini muted">版號／菲林／修改次數需重新匯入一次 Excel</div>';
        return base + `<div class="prt3"><div><span>總版號數</span><b>${fmt(A.kv)}</b>${dv(A.kv, B.kv)}<small>菲林版號</small></div><div><span>菲林張數</span><b>${fmt(A.films)}</b>${dv(A.films, B.films)}<small>版 × 段 × 色</small></div><div><span>修改次數</span><b>${fmt(A.revN)}</b>${dv(A.revN, B.revN)}<small>修改率 ${pct(A.revRate, 0)}</small></div></div>${A.reworkH >= 1 ? `<div class="mini">修改重畫估計佔用 <b>${fmt(A.reworkH, 0)} h</b>（印刷圖稿工時的 ${pct(A.h ? A.reworkH / A.h : null, 0)}，修改以首次繪製的 ${tg('rwk')}% 計）</div>` : ''}`; }
      return `<div class="mini">投入工時 ${fmt(K.lineH[l], 1)} h${K.out[l] && K.lineH[l] >= 10 ? ` · 每${UNIT[l]} ${fmt(K.lineH[l] / K.out[l], 2)} h` : ''}</div>`;
    };

  /* ---------- 直接作業內容解析 ---------- */
  const PARTS = ['鞋羽饰条', '鞋羽下片', '内沿条', '外沿条', '大底布', '前护片', '后跟标', '鞋垫', '领口', '鞋头', '鞋羽', '后包', '鞋舌', '沿条', '大底', '饰条', '鞋带', '中底', '护片', '布标', '内里'];
  const STYLE_SERIES = ['CLASSIC', 'SMU', 'CATB', 'PINNACLE', 'FSR', 'PHOTO', 'OTW', 'CFM', 'CARRYOVER', 'AUTHENTIC', 'SK8', 'OLD SKOOL', 'LX', 'ANTHEM'];
  const ACTIONS = [['3D 切片打印', /切片|打印|切且/], ['3D 掃描', /扫描/], ['打磨後處理', /磨/], ['渲染', /渲染|贴图|keyshot/i], ['檢查／修改', /检查|核对|校对|修改|更改|调整|修正/], ['繪製建模', /绘制|画(?!线模)|建模|白模/], ['裁剪', /裁剪|裁/]];
  const contCache = new Map();
  function parseCont(t) {
    const key = t.s + '|' + t.x; if (contCache.has(key)) return contCache.get(key);
    let x = DPC.simp(t.x || '').replace(/（/g, '(').replace(/）/g, ')').replace(/胶/g, '胶').replace(/腳/g, '脚');
    const season = ((/\b([FSH]\d{2})\b/i.exec(x) || [])[1] || '').toUpperCase();
    const up = x.toUpperCase(); const series = STYLE_SERIES.filter(s => up.includes(s));
    const cutters = [...new Set((x.match(/V-\d{2}-\d{2,3}[A-Z]?(?:-[A-Z])?(?:\(\d+\))?/gi) || []).map(c => c.toUpperCase()))];
    let rest = x; const parts = [];
    PARTS.forEach(p => { if (rest.includes(p)) { parts.push(p); rest = rest.split(p).join('□'); } });
    let action = '圖稿／位置版製作';
    for (const [n, re] of ACTIONS) if (re.test(x)) { action = n; break; }
    if (action === '圖稿／位置版製作' && !/图稿|位置版|菲林|ai/i.test(DPC.simp(t.s))) action = '其他';
    const sizes = (x.match(/\d+(?:\.\d)?#/g) || []).length;
    const r = { season, series, cutters, parts, action, sizes }; contCache.set(key, r); return r;
  }
  const PARTS_TC = { '鞋头': '鞋頭', '后包': '後包', '沿条': '沿條', '内沿条': '內沿條', '外沿条': '外沿條', '前护片': '前護片', '领口': '領口', '鞋羽饰条': '鞋羽飾條', '饰条': '飾條', '鞋带': '鞋帶', '护片': '護片', '布标': '布標', '后跟标': '後跟標', '内里': '內裡', '鞋垫': '鞋墊' };
  const tcPart = p => PARTS_TC[p] || p;

    const all = T_of(m).filter(t => t.b === '直接作業' && isShown(t.k));

    const acts = agg(t => [parseCont(t).action]);
    const parts = agg(t => parseCont(t).parts.map(tcPart));

    const sers = agg(t => parseCont(t).series);

    const ACOL = { '圖稿／位置版製作': 'var(--s1)', '3D 切片打印': 'var(--s6)', '繪製建模': 'var(--s4)', '檢查／修改': 'var(--s2)', '3D 掃描': 'var(--s5)', '打磨後處理': 'var(--s3)', '渲染': 'var(--s7)', '裁剪': 'var(--s8)', '其他': 'var(--neutral)' };

    all.forEach(t => { const s = subs.includes(t.s || '(未分類)') ? (t.s || '(未分類)') : '其他'; const k = t.k + '|' + s; cell[k] = (cell[k] || 0) + t.h; mx = Math.max(mx, cell[k]); });

    const heat = `<div class="tw"><table class="tbl heat"><thead><tr><th>人員</th>${cols.map(c => `<th class="n">${esc(c)}</th>`).join('')}<th class="n">合計</th></tr></thead><tbody>${people.map(k => { const rowT = sum(cols.map(c => cell[k + '|' + c] || 0)); return `<tr><td><b>${esc(pname(k))}</b></td>${cols.map(c => { const v = cell[k + '|' + c] || 0, p = mx ? v / mx : 0; return `<td class="n" style="background:${v ? `color-mix(in srgb, var(--s1) ${Math.round(12 + p * 78)}%, var(--card))` : 'transparent'};color:${p > 0.42 ? '#fff' : 'var(--text)'}" data-tip="${esc(`<b>${esc(pname(k))}</b><br>${esc(c)}：${fmt(v, 1)} h（佔本人 ${pct(rowT ? v / rowT : 0)}）`)}">${v ? fmt(v, 1) : ''}</td>`; }).join('')}<td class="n"><b>${fmt(rowT, 1)}</b></td></tr>`; }).join('')}</tbody></table></div>`;
    /* 人員摘要 */
    const psum = people.filter(k => !S.wp || k === S.wp).map(k => { const R = all.filter(t => t.k === k), h = sum(R.map(t => t.h)); const cs = new Set(); const pa = {}, ac = {}; R.forEach(t => { const c = parseCont(t); c.cutters.forEach(x => cs.add(x)); c.parts.forEach(p => pa[p] = (pa[p] || 0) + t.h / c.parts.length); ac[c.action] = (ac[c.action] || 0) + t.h; });
      const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([n, v]) => `${n === '圖稿／位置版製作' ? '圖稿製作' : tcPart(n)} ${pct(v / h, 0)}`).join('、') || '—';
      return [`<b>${esc(pname(k))}</b>`, fmt(h, 1), fmt(R.length), fmt(cs.size), cs.size ? fmt(h / cs.size, 1) : '—', top(ac), top(pa)]; });
    const lst = (rows, unit) => rows.slice(0, 10).map(([l, x]) => ({ l, v: x.h, extra: `${x.n} 筆 · 平均 ${fmt(x.h / x.n, 1)} h/筆 · ${[...x.p].join('、')}` }));
    const cutRows = cuts.slice(0, 12).map(([c, x]) => [`<b>${esc(c)}</b>`, fmt(x.h, 1), fmt(x.n), esc([...x.p].join('、'))]);
    const det = T.slice().sort((a, b) => a.d < b.d ? 1 : -1);
    S._wdet = det;
    return `${sel}
      <div class="g2">${card('依動作分類', '從作業內容關鍵字判定：繪製／切片打印／掃描／檢查修改／打磨…；圖稿類沒有動作詞的歸為「圖稿／位置版製作」', hbars(acts.map(([l, x]) => ({ l, v: x.h, c: ACOL[l], extra: `${x.n} 筆 · 佔 ${pct(x.h / tot)}` })), { unit: 'h' }))}
      ${card('依部位', '一筆含多個部位時工時平均分攤；滑鼠移上去看筆數與平均工時', parts.length ? hbars(lst(parts), { unit: 'h', color: 'var(--s2)' }) : '<p class="muted">沒有可辨識的部位</p>')}</div>
      <div class="g2">${card('依季節 × 系列', '', `<div class="g2 inner"><div><h4>季節</h4>${seas.length ? hbars(lst(seas), { unit: 'h', color: 'var(--s3)' }) : '<p class="muted">—</p>'}</div><div><h4>系列</h4>${sers.length ? hbars(lst(sers), { unit: 'h', color: 'var(--s7)' }) : '<p class="muted">—</p>'}</div></div>`)}
      ${card('斬刀編號 Top 12', `本月共 ${fmt(cuts.length)} 個斬刀；工時越高代表該款投入越多`, table([{ h: '斬刀' }, { h: '工時 h', n: 1 }, { h: '筆數', n: 1 }, { h: '參與人員' }], cutRows, { empty: '沒有可辨識的斬刀編號' }))}</div>

  }

  const VIEWS = { overview: vOverview, output: vOutput, time: vTime, otd: vOtd, equip: vEquip, work: vWork, people: vPeople, projects: vProjects };

  /* ---------- 版面 ---------- */
  function emptyState() {
    const canEdit = S.mode === 'local' || DB.canWrite !== false;
    return `<div class="hero"><h2>Digital Product Creation</h2><p>每月匯入一次工作彙整 Excel，6 個管理模塊自動更新：月度總覽、產出量、工時結構、交期達成、人員與培訓、專項與改善。</p>
      ${canEdit ? `<label class="dz big" id="dz"><input type="file" accept=".xlsx" hidden id="fi2"><b>拖曳 Excel 到這裡，或點擊選擇檔案</b><span>例如「Inovation DPC 工作彙整（11.17）.xlsx」· 只在瀏覽器內解析</span></label>` : `<p class="muted">${S.loading ? '正在讀取共享資料…' : '資料尚未匯入，請等候部門管理者更新。'}</p>`}

  function render() {

  function banner(msg, kind) { const b = $('#banner'); if (!msg) { b.hidden = true; return; } b.hidden = false; b.className = 'banner ' + (kind || ''); b.innerHTML = msg; }

  /* ---------- 互動綁定 ---------- */
  function bindView() {
    const fi = $('#fi2'); if (fi) fi.onchange = e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; };
    const wp = $('#wp'); if (wp) wp.onchange = e => { S.wp = e.target.value; render(); };

    const cf = $('#concl-f');
    if (cf) cf.onsubmit = async e => {
      e.preventDefault(); const fd = new FormData(cf); const t = String(fd.get('t') || '').trim(); if (!t) { cf.querySelector('input').focus(); toast('請先輸入結論內容'); return; }
      const L = mergedConcl(S.month).list, sv = String(fd.get('s') || 'info');
      if (S.cedit != null && L[S.cedit]) { L[S.cedit].s = sv; L[S.cedit].t = t; } else L.push({ s: sv, t });
      S.cedit = null; await saveConcl(S.month, conclToSaved(S.month, L)); render(); const inp = $('#concl-f input'); if (inp) inp.focus(); toast('已儲存結論');
    };

    if (cl && cl.querySelector('[draggable]')) {
      let from = null;
      cl.addEventListener('dragstart', e => { const li = e.target.closest('li'); if (!li) return; from = +li.dataset.i; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(from)); } catch (_) { } });
      cl.addEventListener('dragend', e => { const li = e.target.closest('li'); if (li) li.classList.remove('dragging'); cl.querySelectorAll('.drop-a,.drop-b').forEach(x => x.classList.remove('drop-a', 'drop-b')); });
      cl.addEventListener('dragover', e => { const li = e.target.closest('li'); if (!li || from == null) return; e.preventDefault(); const r = li.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2; cl.querySelectorAll('.drop-a,.drop-b').forEach(x => x.classList.remove('drop-a', 'drop-b')); li.classList.add(after ? 'drop-b' : 'drop-a'); });
      cl.addEventListener('drop', async e => { const li = e.target.closest('li'); if (!li || from == null) return; e.preventDefault(); const r = li.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2; let to = +li.dataset.i + (after ? 1 : 0); const L = mergedConcl(S.month).list; const [it] = L.splice(from, 1); if (to > from) to--; L.splice(to, 0, it); from = null; S.cedit = null; await saveConcl(S.month, conclToSaved(S.month, L)); render(); toast('已調整順序'); });
    }
    const f = $('#setf');
    if (f) f.onsubmit = async e => {
      e.preventDefault(); const fd = new FormData(f);
      const um = String(fd.get('unitMap') || '').split('\n').map(l => l.split('|').map(s => s.trim())).filter(a => a.length >= 3 && a[0]).map(a => ({ name: a[0], kw: a[1].split(/[,，]/).map(s => s.trim()).filter(Boolean), line: LINES.includes(a[2]) ? a[2] : '印刷圖稿' }));
      const lm = String(fd.get('lineMap') || '').split('\n').map(l => l.split('|').map(s => s.trim())).filter(a => a.length >= 2 && LINES.includes(a[0])).map(a => ({ line: a[0], kw: a[1].split(/[,，]/).map(s => s.trim()).filter(Boolean) }));
      const left = String(fd.get('leftStaff') || '').split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean);
      const mi = {}; for (const [k, v] of fd.entries()) if (k.startsWith('mi:') && /^\d{4}-\d{2}$/.test(String(v))) mi[k.slice(3)] = String(v);
      const ns = { machIntro: Object.keys(mi).length ? mi : clone(DEFAULT_SETTINGS.machIntro), leftStaff: left, lineMap: lm.length ? lm : clone(DEFAULT_SETTINGS.lineMap), targets: { direct: +fd.get('direct') || 60, problem: +fd.get('problem') || 20, otd: +fd.get('otd') || 95, dayH: +fd.get('dayH') || 8, equipH: +fd.get('equipH') || 7, equipU: +fd.get('equipU') || 60, equipBase: String(fd.get('equipBase') || 'log'), scanMin: +fd.get('scanMin') || 8, scanWhite: +fd.get('scanWhite') || 90, otdCov: fd.get('otdCov') === '' ? 80 : +fd.get('otdCov'), rwk: fd.get('rwk') === '' || fd.get('rwk') == null ? 70 : +fd.get('rwk'), trainPct: fd.get('trainPct') === '' || fd.get('trainPct') == null ? 5 : +fd.get('trainPct') }, unitMap: um.length ? um : clone(DEFAULT_SETTINGS.unitMap) };
      await saveSettings(ns); $('#set-st') && ($('#set-st').textContent = '已儲存 ✓');
